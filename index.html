<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Schichtplan</title>
    <!-- Google Fonts für die elegante Schreibschrift -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: #0c0d10;
            /* Dunkle strukturierte Papier-Optik & Roter Glut-Effekt unten */
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(30, 32, 40, 0.6) 0%, transparent 70%),
                linear-gradient(to top, rgba(180, 25, 0, 0.8) 0%, rgba(100, 10, 0, 0.3) 15%, transparent 40%),
                radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0);
            background-size: 100% 100%, 100% 100%, 4px 4px;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        /* Der große äußere weiße Rahmen */
        .app-container {
            width: 100%;
            max-width: 480px;
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 28px;
            padding: 20px 14px 24px 14px;
            background: rgba(12, 13, 16, 0.75);
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.8), inset 0 0 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        /* Header Steuerung (Monat wechseln, Sync Info) */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 4px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-title-area {
            text-align: center;
        }

        .year-text {
            color: #ff1a00;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 2px;
            line-height: 1;
            text-shadow: 0 0 12px rgba(255, 26, 0, 0.4);
        }

        .month-script {
            font-family: 'Great Vibes', cursive;
            font-size: 2.4rem;
            color: #ffffff;
            line-height: 1.1;
            margin-top: -2px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        /* Status & Cloud Info Box */
        .status-banner {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 0.7rem;
            text-align: center;
            margin-bottom: 14px;
            color: #aaa;
        }
        .status-banner span { color: #ff4d4d; font-weight: bold; }

        /* Aktionen (Zurücksetzen / Sync) */
        .action-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        .btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 6px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn.danger { color: #ff6b6b; border-color: rgba(255, 107, 107, 0.3); }

        /* Kalender Raster (Exakter Vorlagen-Look) */
        .calendar-card {
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            border-radius: 14px;
            padding: 6px;
            background: rgba(8, 9, 12, 0.6);
        }

        .weekdays-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
            font-size: 0.7rem;
            font-weight: 800;
            color: #fff;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
        }

        .day-cell {
            background: rgba(15, 18, 24, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            padding: 4px 2px;
            min-height: 54px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
        }

        .day-cell:active { transform: scale(0.95); }
        .day-cell.other-month { opacity: 0.2; }
        .day-cell.today { border-color: #ff1a00 !important; box-shadow: 0 0 8px rgba(255, 26, 0, 0.4); }
        .day-cell.selecting { border: 2px dashed #ff4d4d !important; background: rgba(255, 77, 77, 0.15); }

        .day-number {
            font-size: 0.65rem;
            font-weight: 700;
            color: #ddd;
            width: 100%;
            text-align: right;
            padding-right: 3px;
        }

        .shift-badge {
            width: 100%;
            border-radius: 5px;
            padding: 2px 1px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .shift-name {
            font-size: 0.5rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .shift-time {
            font-size: 0.45srem;
            font-size: 4px;
            opacity: 0.8;
            display: none; /* Clean look wie auf Vorlage */
        }

        /* Schicht-Farben passend zum edlen Dark-Style */
        .s-fruh { background: #112a46; color: #58a6ff; border: 1px solid rgba(88, 166, 255, 0.3); }
        .s-nacht { background: #231238; color: #bc8cff; border: 1px solid rgba(188, 140, 255, 0.3); }
        .s-mittags { background: #381f0d; color: #ffa657; border: 1px solid rgba(255, 166, 87, 0.3); }
        .s-frei { background: #0d2215; color: #3fb950; border: 1px solid rgba(63, 185, 80, 0.3); }
        .s-urlaub { background: #3b1111; color: #ff7b72; border: 1px solid rgba(255, 123, 114, 0.5); font-weight: 900; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="top-bar">
        <button class="nav-btn" onclick="changeMonth(-1)">❮</button>
        <div class="header-title-area">
            <div class="year-text" id="yearText">2026</div>
            <div class="month-script" id="monthScript">Oktober</div>
        </div>
        <button class="nav-btn" onclick="changeMonth(1)">❯</button>
    </div>

    <div class="status-banner" id="infoBox">
        💡 <span>Urlaub:</span> Tippe Start & Enddatum. Einzelner Klick löscht Urlaub.
    </div>

    <div class="action-buttons">
        <button class="btn" onclick="fetchCloudData()">🔄 Live-Sync laden</button>
        <button class="btn danger" onclick="resetVacation()">🗑️ Alles löschen</button>
    </div>

    <div class="calendar-card">
        <div class="weekdays-header">
            <div>MO</div><div>DI</div><div>MI</div><div>DO</div><div>FR</div><div>SA</div><div>SO</div>
        </div>
        <div class="days-grid" id="daysGrid"></div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://lbjpkereemplchdaltpz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxianBrZXJlZW1wbGNoZGFsdHB6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5MDMyNjUsImV4cCI6MjEwNzQ3OTI2NX0.iFPEv3qyhgiLdU55Iday-HssYZdDbYaQolpvglcLcpw";
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentDisplayDate = new Date(2026, 9, 13);
    const shiftCycle = ["fruh", "nacht", "mittags"];
    
    const shiftData = {
        fruh: { name: "Früh", class: "s-fruh" },
        nacht: { name: "Nacht", class: "s-nacht" },
        mittags: { name: "Mittags", class: "s-mittags" },
        frei: { name: "Frei", class: "s-frei" },
        urlaub: { name: "URLAUB", class: "s-urlaub" }
    };

    const monthNamesGerman = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];

    let vacationDays = [];
    let selectionStart = null;

    async function fetchCloudData() {
        setInfo("🔄 Lade Live-Daten...");
        try {
            const { data, error } = await supabaseClient
                .from('vacation_days')
                .select('dates')
                .eq('id', 'shared_plan')
                .maybeSingle();

            if (error) {
                setInfo("⚠️ Ladefehler");
                return;
            }

            vacationDays = (data && data.dates) ? data.dates : [];
            renderCalendar();
            setInfo("✅ Live-Sync aktiv & synchronisiert!");
        } catch (e) {
            setInfo("⚠️ Verbindungsfehler");
        }
    }

    async function saveCloudData() {
        try {
            const { error } = await supabaseClient
                .from('vacation_days')
                .upsert({ id: 'shared_plan', dates: vacationDays }, { onConflict: 'id' });

            if (error) {
                setInfo(`⚠️ Speicherfehler: ${error.message}`);
            } else {
                setInfo("✨ In Cloud gespeichert!");
            }
        } catch (e) {
            setInfo("⚠️ Netzwerkfehler beim Speichern!");
        }
    }

    function setInfo(text) {
        document.getElementById("infoBox").innerHTML = text;
    }

    function getCalculatedShift(date) {
        const dayOfWeek = (date.getDay() + 6) % 7;
        if (dayOfWeek >= 5) return "frei";

        const d = new Date(date);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : 1);
        const mondayOfWeek = new Date(d.setDate(diff));
        mondayOfWeek.setHours(0,0,0,0);

        const anchorMonday = new Date(2026, 9, 12);
        anchorMonday.setHours(0,0,0,0);

        const diffTime = mondayOfWeek.getTime() - anchorMonday.getTime();
        const diffWeeks = Math.round(diffTime / (1000 * 3600 * 24 * 7));

        let cycleIndex = diffWeeks % 3;
        if (cycleIndex < 0) cycleIndex += 3;

        return shiftCycle[cycleIndex];
    }

    function getShiftForDate(date) {
        const dateString = date.toISOString().split('T')[0];
        if (vacationDays.includes(dateString)) return "urlaub";
        return getCalculatedShift(date);
    }

    function renderCalendar() {
        const grid = document.getElementById("daysGrid");
        grid.innerHTML = "";

        const year = currentDisplayDate.getFullYear();
        const month = currentDisplayDate.getMonth();

        document.getElementById("yearText").innerText = year;
        document.getElementById("monthScript").innerText = monthNamesGerman[month];

        const firstDayOfMonth = new Date(year, month, 1);
        let startDayOffset = (firstDayOfMonth.getDay() + 6) % 7;

        let runner = new Date(year, month, 1 - startDayOffset);
        const today = new Date();
        today.setHours(0,0,0,0);

        for (let i = 0; i < 42; i++) {
            const cellDate = new Date(runner);
            cellDate.setHours(0,0,0,0);

            const isCurrentMonth = runner.getMonth() === month;
            const isToday = cellDate.getTime() === today.getTime();
            const dateStr = runner.toISOString().split('T')[0];

            const shiftKey = getShiftForDate(runner);
            const shift = shiftData[shiftKey];

            const cell = document.createElement("div");
            let isSelecting = selectionStart === dateStr;
            cell.className = `day-cell ${isCurrentMonth ? '' : 'other-month'} ${isToday ? 'today' : ''} ${isSelecting ? 'selecting' : ''}`;
            
            cell.onclick = () => handleDateClick(dateStr);

            cell.innerHTML = `
                <div class="day-number">${runner.getDate()}</div>
                <div class="shift-badge ${shift.class}">
                    <div class="shift-name">${shift.name}</div>
                </div>
            `;

            grid.appendChild(cell);
            runner.setDate(runner.getDate() + 1);
        }
    }

    async function handleDateClick(dateStr) {
        if (vacationDays.includes(dateStr)) {
            vacationDays = vacationDays.filter(d => d !== dateStr);
            selectionStart = null;
            setInfo("⏳ Lösche Urlaub...");
            renderCalendar();
            await saveCloudData();
            renderCalendar();
            return;
        }

        if (!selectionStart) {
            selectionStart = dateStr;
            setInfo(`💡 Start: ${dateStr} – Wähle Enddatum!`);
            renderCalendar();
        } else {
            let start = new Date(selectionStart);
            let end = new Date(dateStr);

            if (start > end) {
                let temp = start;
                start = end;
                end = temp;
            }

            let curr = new Date(start);
            while (curr <= end) {
                const dStr = curr.toISOString().split('T')[0];
                if (!vacationDays.includes(dStr)) {
                    vacationDays.push(dStr);
                }
                curr.setDate(curr.getDate() + 1);
            }

            selectionStart = null;
            setInfo("⏳ Speichere Urlaub...");
            renderCalendar();

            await saveCloudData();
            renderCalendar();
        }
    }

    function changeMonth(delta) {
        currentDisplayDate.setMonth(currentDisplayDate.getMonth() + delta);
        renderCalendar();
    }

    async function resetVacation() {
        if (confirm("Wirklich alle Urlaubstage zurücksetzen?")) {
            vacationDays = [];
            setInfo("⏳ Setze zurück...");
            renderCalendar();
            await saveCloudData();
            renderCalendar();
        }
    }

    fetchCloudData();
</script>

</body>
</html>
