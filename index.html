<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Dungeons II - Interaktive Karte</title>
    <style>
        :root {
            --bg-dark: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent: #58a6ff;
            --accent-gold: #f0883e;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 10px; }

        header { text-align: center; padding: 12px 0; border-bottom: 1px solid var(--border-color); margin-bottom: 15px; }
        h1 { color: var(--accent-gold); font-size: 1.4rem; text-transform: uppercase; letter-spacing: 1px; }
        p.subtitle { color: var(--text-muted); font-size: 0.8rem; margin-top: 2px; }

        .map-viewport { position: relative; width: 100%; height: 350px; background: #010409; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        
        /* Simulierter Karten-Hintergrund im Stil von MetaBot / DungeonsDB */
        .map-canvas-bg { width: 100%; height: 100%; background: radial-gradient(circle at center, #1f2937 0%, #0b0f17 100%); position: relative; cursor: grab; display: flex; align-items: center; justify-content: center; }
        .map-grid-lines { position: absolute; width: 100%; height: 100%; background-image: linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 30px 30px; }

        /* Interaktive Pins auf der Karte */
        .map-pin { position: absolute; width: 22px; height: 22px; border-radius: 50%; transform: translate(-50%, -50%); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; border: 2px solid #fff; box-shadow: 0 0 6px rgba(0,0,0,0.8); transition: transform 0.2s; }
        .map-pin:hover { transform: translate(-50%, -50%) scale(1.2); }
        .pin-dungeon { background: #ef4444; color: #fff; }
        .pin-chest { background: #f59e0b; color: #000; }
        .pin-station { background: #3b82f6; color: #fff; }
        .pin-rift { background: #8b5cf6; color: #fff; }

        .map-controls-bar { display: flex; gap: 8px; margin: 12px 0; overflow-x: auto; padding-bottom: 5px; }
        .filter-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; white-space: nowrap; }
        .filter-btn.active { background: var(--accent-gold); color: #000; font-weight: bold; border-color: var(--accent-gold); }

        .info-panel { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; margin-top: 10px; font-size: 0.85rem; display: none; }
        .info-title { font-weight: bold; color: var(--accent-gold); margin-bottom: 4px; font-size: 0.95rem; }

        .coords-display { position: absolute; bottom: 8px; right: 10px; background: rgba(0,0,0,0.7); padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; color: var(--text-muted); font-family: monospace; }
    </style>
</head>
<body>

<header>
    <h1>Minecraft Dungeons II Map</h1>
    <p class="subtitle">Oberwelt & Sift (MetaBot.GG Stil)</p>
</header>

<div class="map-controls-bar">
    <button class="filter-btn active" onclick="filterMap('all', this)">Alle (608)</button>
    <button class="filter-btn" onclick="filterMap('dungeon', this)">Verliese (39)</button>
    <button class="filter-btn" onclick="filterMap('chest', this)">Kisten (112)</button>
    <button class="filter-btn" onclick="filterMap('station', this)">Loren (20)</button>
    <button class="filter-btn" onclick="filterMap('rift', this)">Risse (46)</button>
</div>

<div class="map-viewport">
    <div class="map-canvas-bg" id="mapCanvas" onclick="resetInfo()">
        <div class="map-grid-lines"></div>
        
        <!-- Pins platziert nach Koordinaten (z.B. v=2404,3762) -->
        <div class="map-pin pin-dungeon" style="top: 35%; left: 25%;" onclick="showInfo(event, 'Verlies: Honigwabenfelder', 'Empfohlene Stufe 2. Eingang zu verdeckten Kammern.')">🏰</div>
        <div class="map-pin pin-chest" style="top: 50%; left: 45%;" onclick="showInfo(event, 'Gold-Truhe #42', 'Enthält seltene Rüstungsteile und Smaragde.')">📦</div>
        <div class="map-pin pin-station" style="top: 70%; left: 65%;" onclick="showInfo(event, 'Lorenstation: Honeybrook', 'Schnellreisepunkt zur Verbindung mit der Basis.')">🚂</div>
        <div class="map-pin pin-rift" style="top: 25%; left: 80%;" onclick="showInfo(event, 'Seelenriss #12', 'Führt in die Schattenebene des Sift.')">🌀</div>
        <div class="map-pin pin-dungeon" style="top: 60%; left: 20%;" onclick="showInfo(event, 'Verlies: Heulwälder', 'Empfohlene Stufe 6. Vorsicht vor Gruft-Gegnern.')">🏰</div>
        
        <div class="coords-display">X: 2404 | Z: 3762 | Zoom: 1.5x</div>
    </div>
</div>

<div id="infoPanel" class="info-panel">
    <div id="infoTitle" class="info-title">Wähle einen Punkt</div>
    <div id="infoDesc" style="color: var(--text-muted);">Tippe auf einen farbigen Marker auf der Karte, um Details zu sehen.</div>
</div>

<script>
function showInfo(event, title, desc) {
    event.stopPropagation();
    const panel = document.getElementById('infoPanel');
    panel.style.display = 'block';
    document.getElementById('infoTitle').innerText = title;
    document.getElementById('infoDesc').innerText = desc;
}

function resetInfo() {
    document.getElementById('infoPanel').style.display = 'none';
}

function filterMap(type, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    
    const pins = document.querySelectorAll('.map-pin');
    pins.forEach(pin => {
        if(type === 'all' || pin.classList.contains('pin-' + type)) {
            pin.style.display = 'flex';
        } else {
            pin.style.display = 'none';
        }
    });
}
</script>

</body>
</html>
