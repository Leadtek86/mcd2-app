<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Dungeons DB - Map & Items</title>
    <style>
        :root {
            --bg-dark: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent-gold: #f0883e;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --common: #a0a0a0;
            --rare: #5555ff;
            --unique: #ffaa00;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 12px; scroll-behavior: smooth; }

        header { text-align: center; padding: 10px 0; border-bottom: 1px solid var(--border-color); margin-bottom: 15px; }
        h1 { color: #f0883e; font-size: 1.4rem; text-transform: uppercase; letter-spacing: 1px; }
        p.subtitle { color: var(--text-muted); font-size: 0.8rem; margin-top: 2px; }

        .section-title { font-size: 1rem; color: #f0883e; margin: 15px 0 8px 0; text-transform: uppercase; letter-spacing: 0.5px; display: flex; justify-content: space-between; align-items: center; }

        /* Weltkarte Container */
        .map-container { width: 100%; height: 340px; background: #000; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; position: relative; }
        
        .map-wrapper { 
            width: 100%; 
            height: 100%; 
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1); 
            transform-origin: center center; 
            position: relative; 
            display: inline-block;
        }
        
        .map-image { width: 100%; height: 100%; object-fit: contain; display: block; }

        /* Stecknadel exakt auf Bildkoordinaten */
        .map-pin-box {
            position: absolute;
            transform: translate(-50%, -100%);
            display: none;
            z-index: 20;
            pointer-events: none;
            text-align: center;
        }

        .map-pin {
            font-size: 2.2rem;
            line-height: 1;
            filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.9));
            animation: bounce 0.8s infinite alternate;
        }

        .map-pin-label {
            background: rgba(13, 17, 23, 0.95);
            color: #ffaa00;
            border: 1px solid #f0883e;
            padding: 3px 7px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            white-space: nowrap;
            margin-top: -5px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }

        .reset-map-btn { font-size: 0.75rem; background: #21262d; color: #fff; border: 1px solid var(--border-color); padding: 4px 8px; border-radius: 4px; cursor: pointer; }

        /* Filter Controls */
        .controls { display: flex; flex-direction: column; gap: 8px; margin: 15px 0; }
        select, input { width: 100%; padding: 10px; background: var(--card-bg); border: 1px solid var(--border-color); color: #fff; border-radius: 6px; font-size: 0.9rem; }

        .filter-row { display: flex; gap: 8px; }

        /* Item Cards */
        .drop-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
        .item-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; display: flex; gap: 10px; align-items: center; cursor: pointer; transition: background 0.2s; }
        .item-card:hover { background: #21262d; }
        .item-card.common { border-left: 4px solid var(--common); }
        .item-card.rare { border-left: 4px solid var(--rare); }
        .item-card.unique { border-left: 4px solid var(--unique); background: linear-gradient(90deg, rgba(255,170,0,0.06) 0%, var(--card-bg) 100%); }

        .item-icon-box { width: 44px; height: 44px; background: #0d1117; border-radius: 6px; border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0; }
        .item-details-box { flex-grow: 1; display: flex; flex-direction: column; gap: 3px; }
        .item-row { display: flex; justify-content: space-between; align-items: center; }
        .item-name { font-weight: bold; font-size: 0.95rem; }
        .item-name.common { color: var(--common); }
        .item-name.rare { color: #8888ff; }
        .item-name.unique { color: var(--unique); }

        .rarity-tag { font-size: 0.65rem; font-weight: bold; padding: 2px 5px; border-radius: 3px; text-transform: uppercase; }
        .tag-common { background: #333; color: var(--common); }
        .tag-rare { background: #1a1a44; color: #8888ff; }
        .tag-unique { background: #443300; color: var(--unique); }

        .item-info { font-size: 0.75rem; color: var(--text-muted); }
        .item-effect { font-size: 0.8rem; color: #ddd; }

        .boss-info-box { background: rgba(0,0,0,0.3); border: 1px solid #30363d; padding: 4px 8px; border-radius: 4px; margin-top: 4px; font-size: 0.75rem; display: flex; justify-content: space-between; align-items: center; }
        .boss-name { color: #ff5555; font-weight: bold; }
        .drop-rate { color: #55ff55; font-weight: bold; }

        .location-badge { font-size: 0.75rem; color: var(--accent-gold); font-weight: bold; display: inline-flex; align-items: center; gap: 4px; margin-top: 2px; }
    </style>
</head>
<body>

<header>
    <h1>Minecraft Dungeons DB</h1>
    <p class="subtitle">Weltkarte & Exakte Gegner-Drops</p>
</header>

<div class="section-title">
    <span>Interaktive Weltkarte</span>
    <button class="reset-map-btn" onclick="resetMap()">🗺️ Übersicht</button>
</div>

<div class="map-container" id="mapContainer">
    <div class="map-wrapper" id="mapWrapper">
        <img src="map.jpg" alt="Minecraft Dungeons Weltkarte" class="map-image">
        <div class="map-pin-box" id="mapPinBox">
            <div class="map-pin">📍</div>
            <div class="map-pin-label" id="mapPinLabel">Gegner-Spawn</div>
        </div>
    </div>
</div>

<div class="section-title">Loot-Datenbank (<span id="itemCount">0</span> Items)</div>

<div class="controls">
    <input type="text" id="searchInput" placeholder="Item, Boss, Effekt oder Region suchen..." oninput="updateView()">
    <div class="filter-row">
        <select id="regionSelect" onchange="updateView()">
            <option value="all">Alle Regionen</option>
            <option value="brave_haven">Brave Haven</option>
            <option value="honeycomb_fields">Honeycomb Fields</option>
            <option value="howling_woods">Howling Woods</option>
            <option value="frozen_highlands">Frozen Highlands</option>
            <option value="rainy_plains">Rainy Plains</option>
        </select>
        <select id="categorySelect" onchange="updateView()">
            <option value="all">Alle Typen</option>
            <option value="Nahkampf">Nahkampf</option>
            <option value="Fernkampf">Fernkampf</option>
            <option value="Rüstung">Rüstung</option>
            <option value="Artefakt">Artefakt</option>
        </select>
    </div>
</div>

<div class="drop-grid" id="dropList"></div>

<script>
// Erweiterte Item-Datenbank mit exakten % Koordinaten auf deiner Karte
const itemsDB = [
    // BRAVE HAVEN (Links oben)
    { name: "Söldner-Großschwert", type: "Nahkampf", rarity: "rare", symbol: "⚔️", region: "brave_haven", x: "12%", y: "36%", effect: "Schwere Hiebe mit hoher Reichweite.", bestEnemy: "Hafen-Kapitän Mini-Boss", dropRate: "22%" },
    { name: "Seeräuber-Rüstung", type: "Rüstung", rarity: "unique", symbol: "🏴‍☠️", region: "brave_haven", x: "10%", y: "38%", effect: "+20% Angriffsgeschwindigkeit.", bestEnemy: "Elite Piraten-Skelett", dropRate: "14%" },
    { name: "Matrosen-Bogen", type: "Fernkampf", rarity: "common", symbol: "🏹", region: "brave_haven", x: "14%", y: "37%", effect: "Schnelle Schussfolge.", bestEnemy: "Hafen-Wache", dropRate: "30%" },

    // HONEYCOMB FIELDS (Mitte Links)
    { name: "Honig-Messer", type: "Nahkampf", rarity: "rare", symbol: "🗡️", region: "honeycomb_fields", x: "32%", y: "30%", effect: "Verlangsamungseffekt bei Treffern.", bestEnemy: "Bienenkönigin / Elite Biene", dropRate: "18%" },
    { name: "Bienen-Rüstung", type: "Rüstung", rarity: "unique", symbol: "🐝", region: "honeycomb_fields", x: "29%", y: "33%", effect: "Beschwört Bienen bei erlittenem Schaden.", bestEnemy: "Mini-Boss: Bienenwabe", dropRate: "12%" },
    { name: "Imker-Schleuder", type: "Fernkampf", rarity: "common", symbol: "🎯", region: "honeycomb_fields", x: "34%", y: "31%", effect: "Verursacht Giftschaden im Umkreis.", bestEnemy: "Waben-Wächter", dropRate: "25%" },
    { name: "Honig-Amulett", type: "Artefakt", rarity: "rare", symbol: "🍯", region: "honeycomb_fields", x: "31%", y: "28%", effect: "Heilt Verbündete und verlangsamt Gegner.", bestEnemy: "Riesen-Drohne", dropRate: "20%" },

    // HOWLING WOODS (Mitte)
    { name: "Wolfs-Rüstung", type: "Rüstung", rarity: "rare", symbol: "🐺", region: "howling_woods", x: "48%", y: "32%", effect: "+20% Waffen-Schadens-Aura für Verbündete.", bestEnemy: "Höhlen-Alptraum Wolf", dropRate: "15%" },
    { name: "Sumpf-Klinge", type: "Nahkampf", rarity: "unique", symbol: "🗡️", region: "howling_woods", x: "52%", y: "34%", effect: "Fügt zusätzlich Giftschaden über Zeit zu.", bestEnemy: "Skelett-Monomaniac", dropRate: "10%" },
    { name: "Jagdbogen", type: "Fernkampf", rarity: "rare", symbol: "🏹", region: "howling_woods", x: "50%", y: "30%", effect: "Erhöhter kritischer Trefferschaden.", bestEnemy: "Wald-Jäger Elite", dropRate: "22%" },
    { name: "Mond-Dolche", type: "Nahkampf", rarity: "unique", symbol: "🌙", region: "howling_woods", x: "47%", y: "35%", effect: "Erhöhte Chance auf kritische Treffer bei Vollmond.", bestEnemy: "Schatten-Wulf", dropRate: "11%" },
    { name: "Totem des Schutzes", type: "Artefakt", rarity: "common", symbol: "🛡️", region: "howling_woods", x: "51%", y: "31%", effect: "Blockt eingehende Fernkampf-Geschosse.", bestEnemy: "Skelett-Hexenmeister", dropRate: "28%" },

    // FROZEN HIGHLANDS (Oben Rechts - Schnee)
    { name: "Eis-Sensen-Klinge", type: "Nahkampf", rarity: "unique", symbol: "❄️", region: "frozen_highlands", x: "82%", y: "26%", effect: "Verlangsamt nahe Gegner nach Kills.", bestEnemy: "Frost-Evoker Boss", dropRate: "14%" },
    { name: "Eis-Zauberstab", type: "Artefakt", rarity: "rare", symbol: "🔮", region: "frozen_highlands", x: "78%", y: "30%", effect: "Friert Gegner in einem Zielgebiet ein.", bestEnemy: "Eis-Wächter Mini-Boss", dropRate: "22%" },
    { name: "Schnee-Rüstung", type: "Rüstung", rarity: "rare", symbol: "🧊", region: "frozen_highlands", x: "85%", y: "24%", effect: "Schutz vor Verlangsamung und Einfrieren.", bestEnemy: "Gletscher-Golem", dropRate: "17%" },
    { name: "Frost-Armbrust", type: "Fernkampf", rarity: "unique", symbol: "🏹", region: "frozen_highlands", x: "80%", y: "28%", effect: "Friert Ziele bei Treffer kurzzeitig ein.", bestEnemy: "Eis-Zombie-Anführer", dropRate: "13%" },

    // RAINY PLAINS (Unten)
    { name: "Blitz-Speer", type: "Nahkampf", rarity: "unique", symbol: "⚡", region: "rainy_plains", x: "61%", y: "66%", effect: "Erzeugt Blitzeinschläge bei kritischen Treffern.", bestEnemy: "Gewitter-Gargoyle Boss", dropRate: "11%" },
    { name: "Gewitter-Guthaben", type: "Artefakt", rarity: "rare", symbol: "🌩️", region: "rainy_plains", x: "58%", y: "70%", effect: "Ruft Blitze auf mehrere nahe Gegner.", bestEnemy: "Sturm-Beschwörer", dropRate: "19%" },
    { name: "Regen-Bogen", type: "Fernkampf", rarity: "common", symbol: "🌧️", region: "rainy_plains", x: "63%", y: "72%", effect: "Erhöhte Pfeil-Geschwindigkeit bei Regen.", bestEnemy: "Sumpf-Hexe", dropRate: "26%" },
    { name: "Sturm-Rüstung", type: "Rüstung", rarity: "unique", symbol: "🌪️", region: "rainy_plains", x: "60%", y: "64%", effect: "Erhöht die Zauber-Geschwindigkeit um 30%.", bestEnemy: "Wolkenschreck Mini-Boss", dropRate: "12%" }
];

function focusTarget(x, y, enemyName) {
    const wrapper = document.getElementById('mapWrapper');
    const pinBox = document.getElementById('mapPinBox');
    const label = document.getElementById('mapPinLabel');

    // Stecknadel exakt an die x/y Prozent-Koordinaten des Gegners setzen
    pinBox.style.left = x;
    pinBox.style.top = y;
    pinBox.style.display = 'block';
    label.innerText = enemyName || "Gegner Spawn";

    // Zoom & Fokus exakt auf den Punkt
    wrapper.style.transform = `scale(2.6) translate(calc(50% - ${x}), calc(50% - ${y}))`;

    // Nach oben zur Karte scrollen
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetMap() {
    const wrapper = document.getElementById('mapWrapper');
    const pinBox = document.getElementById('mapPinBox');
    pinBox.style.display = 'none';
    wrapper.style.transform = 'scale(1) translate(0px, 0px)';
}

function updateView() {
    const selectedRegion = document.getElementById('regionSelect').value;
    const selectedCategory = document.getElementById('categorySelect').value;
    const searchFilter = document.getElementById('searchInput').value.toLowerCase();
    
    const dropContainer = document.getElementById('dropList');
    dropContainer.innerHTML = '';

    const filtered = itemsDB.filter(item => {
        const matchesRegion = (selectedRegion === 'all' || item.region === selectedRegion);
        const matchesCategory = (selectedCategory === 'all' || item.type === selectedCategory);
        const matchesSearch = item.name.toLowerCase().includes(searchFilter) || 
                              item.effect.toLowerCase().includes(searchFilter) ||
                              item.bestEnemy.toLowerCase().includes(searchFilter) ||
                              item.region.toLowerCase().includes(searchFilter);

        return matchesRegion && matchesCategory && matchesSearch;
    });

    document.getElementById('itemCount').innerText = filtered.length;

    filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = `item-card ${item.rarity}`;
        let rarityText = item.rarity === 'unique' ? 'Einzigartig' : (item.rarity === 'rare' ? 'Selten' : 'Gewöhnlich');

        card.onclick = () => focusTarget(item.x, item.y, item.bestEnemy);

        card.innerHTML = `
            <div class="item-icon-box">${item.symbol}</div>
            <div class="item-details-box">
                <div class="item-row">
                    <span class="item-name ${item.rarity}">${item.name}</span>
                    <span class="rarity-tag tag-${item.rarity}">${rarityText}</span>
                </div>
                <div class="item-info"><strong>Typ:</strong> ${item.type}</div>
                <div class="item-effect">${item.effect}</div>
                <div class="boss-info-box">
                    <span>👾 Gegner: <span class="boss-name">${item.bestEnemy}</span></span>
                    <span class="drop-rate">🎯 ${item.dropRate}</span>
                </div>
                <div class="location-badge">📍 Tippen für exakte Stecknadel auf Gegner</div>
            </div>
        `;
        dropContainer.appendChild(card);
    });
}

updateView();
</script>

</body>
</html>
