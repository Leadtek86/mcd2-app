<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbeitsplan & Schichtkalender</title>
    <style>
        :root {
            --bg-dark: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent-gold: #f0883e;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            
            /* Schichtfarben */
            --fruh-bg: #1f3a5f;
            --fruh-border: #388bfd;
            --nacht-bg: #3c1e5a;
            --nacht-border: #a371f7;
            --spat-bg: #5a3214;
            --spat-border: #f0883e;
            --frei-bg: #16231a;
            --frei-border: #238636;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 12px; }

        header { text-align: center; padding: 12px 0; border-bottom: 1px solid var(--border-color); margin-bottom: 16px; }
        h1 { color: var(--accent-gold); font-size: 1.4rem; text-transform: uppercase; letter-spacing: 1px; }
        p.subtitle { color: var(--text-muted); font-size: 0.8rem; margin-top: 4px; }

        /* Legende */
        .legend { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 16px; }
        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; background: var(--card-bg); padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border-color); }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .dot.fruh { background: var(--fruh-border); }
        .dot.nacht { background: var(--nacht-border); }
        .dot.spat { background: var(--spat-border); }
        .dot.frei { background: var(--frei-border); }

        /* Navigation */
        .month-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; background: var(--card-bg); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border-color); }
        .month-nav button { background: #21262d; color: #fff; border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
        .month-title { font-weight: bold; font-size: 1rem; color: #fff; }

        /* Wochen-Raster */
        .week-container { display: flex; flex-direction: column; gap: 12px; }
        .week-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; }
        .week-header { font-size: 0.85rem; font-weight: bold; color: var(--accent-gold); margin-bottom: 8px; display: flex; justify-content: space-between; }

        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        @media (max-width: 600px) {
            .days-grid { grid-template-columns: 1fr; }
        }

        .day-box { background: #0d1117; border: 1px solid var(--border-color); border-radius: 6px; padding: 8px; display: flex; flex-direction: column; justify-content: space-between; min-height: 58px; }
        .day-box.today { border: 2px solid #ff0055 !important; }
        
        .day-header { display: flex; justify-content: space-between; font-size: 0.75rem; font-weight: bold; margin-bottom: 4px; }
        .day-name { color: var(--text-muted); }
        .day-date { color: #fff; }

        .shift-badge { font-size: 0.7rem; font-weight: bold; padding: 3px 6px; border-radius: 4px; text-align: center; text-transform: uppercase; }
        .shift-fruh { background: var(--fruh-bg); color: #79c0ff; border: 1px solid var(--fruh-border); }
        .shift-nacht { background: var(--nacht-bg); color: #d2a8ff; border: 1px solid var(--nacht-border); }
        .shift-spat { background: var(--spat-bg); color: #ffa657; border: 1px solid var(--spat-border); }
        .shift-frei { background: var(--frei-bg); color: #7ee787; border: 1px solid var(--frei-border); opacity: 0.7; }
    </style>
</head>
<body>

<header>
    <h1>Arbeitsplan</h1>
    <p class="subtitle">3-Wochen-Rhythmus (Mo – Fr Arbeit / Sa – So Frei)</p>
</header>

<div class="legend">
    <div class="legend-item"><span class="dot fruh"></span> Frühschicht</div>
    <div class="legend-item"><span class="dot nacht"></span> Nachtschicht</div>
    <div class="legend-item"><span class="dot spat"></span> Spätschicht</div>
    <div class="legend-item"><span class="dot frei"></span> Wochenende (Frei)</div>
</div>

<div class="month-nav">
    <button onclick="changeMonth(-1)">◀ Vorheriger</button>
    <div class="month-title" id="monthTitle">Oktober 2026</div>
    <button onclick="changeMonth(1)">Nächster ▶</button>
</div>

<div class="week-container" id="scheduleContainer"></div>

<script>
// Anker-Datum: Montag der Frühschicht-Woche (12.10.2026)
const anchorDate = new Date(2026, 9, 12); // Oktober ist Monat index 9
let currentDisplayDate = new Date(2026, 9, 1);

const shiftCycle = ["fruh", "nacht", "spat"]; // 3-Wochen Rhythmus
const shiftLabels = {
    fruh: "Frühschicht",
    nacht: "Nachtschicht",
    spat: "Spätschicht",
    frei: "Frei"
};

const dayNames = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
const monthNames = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];

function getShiftForDate(date) {
    const dayOfWeek = (date.getDay() + 6) % 7; // 0 = Montag, ..., 6 = Sonntag
    if (dayOfWeek >= 5) {
        return "frei"; // Samstag und Sonntag frei
    }

    // Differenz in Tagen zum Anker-Montag berechnen
    const diffTime = date.getTime() - anchorDate.getTime();
    const diffDays = Math.floor(diffTime / (1000 * 3600 * 24));
    
    // Wochen-Differenz berechnen
    const diffWeeks = Math.floor(diffDays / 7);
    
    // Zyklus-Index berechnen (Modulo für positive/negative Wochen)
    let cycleIndex = diffWeeks % 3;
    if (cycleIndex < 0) cycleIndex += 3;

    return shiftCycle[cycleIndex];
}

function renderSchedule() {
    const container = document.getElementById("scheduleContainer");
    container.innerHTML = "";

    const year = currentDisplayDate.getFullYear();
    const month = currentDisplayDate.getMonth();

    document.getElementById("monthTitle").innerText = `${monthNames[month]} ${year}`;

    // Erster Tag des Monats
    let firstDay = new Date(year, month, 1);
    // Erster Montag der Kalenderansicht
    let startDay = new Date(firstDay);
    let dayOffset = (startDay.getDay() + 6) % 7;
    startDay.setDate(startDay.getDate() - dayOffset);

    // Letzter Tag des Monats
    let lastDay = new Date(year, month + 1, 0);

    let runner = new Date(startDay);
    const today = new Date();

    while (runner <= lastDay || (runner.getDay() + 6) % 7 !== 0) {
        const weekCard = document.createElement("div");
        weekCard.className = "week-card";

        // KW ermitteln
        const weekNum = getWeekNumber(runner);
        
        let daysHtml = "";
        for (let i = 0; i < 7; i++) {
            const shift = getShiftForDate(runner);
            const isToday = runner.toDateString() === today.toDateString();
            const dateNum = runner.getDate().toString().padStart(2, '0');
            const monthNum = (runner.getMonth() + 1).toString().padStart(2, '0');

            daysHtml += `
                <div class="day-box ${isToday ? 'today' : ''}">
                    <div class="day-header">
                        <span class="day-name">${dayNames[i]}</span>
                        <span class="day-date">${dateNum}.${monthNum}.</span>
                    </div>
                    <div class="shift-badge shift-${shift}">${shiftLabels[shift]}</div>
                </div>
            `;
            runner.setDate(runner.getDate() + 1);
        }

        weekCard.innerHTML = `
            <div class="week-header">
                <span>Kalenderwoche ${weekNum}</span>
            </div>
            <div class="days-grid">${daysHtml}</div>
        `;

        container.appendChild(weekCard);
    }
}

function changeMonth(delta) {
    currentDisplayDate.setMonth(currentDisplayDate.getMonth() + delta);
    renderSchedule();
}

function getWeekNumber(d) {
    d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
    var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
    var weekNo = Math.ceil(( ( (d - yearStart) / 86400000) + 1)/7);
    return weekNo;
}

renderSchedule();
</script>

</body>
</html>
