<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Dungeons DB - App</title>
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --border-color: #2c2c2c;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            
            --common: #a0a0a0;
            --rare: #5555ff;
            --unique: #ffaa00;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 15px; }

        header { text-align: center; padding: 15px 0; border-bottom: 2px solid #ffaa00; margin-bottom: 20px; }
        h1 { color: #ffaa00; font-size: 1.6rem; letter-spacing: 1px; text-transform: uppercase; }
        p.subtitle { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; }

        .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        select, input { width: 100%; padding: 12px; background: var(--card-bg); border: 1px solid var(--border-color); color: #fff; border-radius: 6px; font-size: 0.95rem; }

        .map-section { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
        .map-header { padding: 15px; background: #252525; border-bottom: 1px solid var(--border-color); }
        .map-title { font-size: 1.2rem; font-weight: bold; color: #ffaa00; }
        .map-meta { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }

        .map-viewer { position: relative; width: 100%; height: 200px; background: #000; overflow: hidden; }
        .map-image { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.9; }

        .section-title { font-size: 1.1rem; color: #ffaa00; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }

        .drop-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        
        .item-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 12px; display: flex; gap: 12px; align-items: center; position: relative; }
        .item-card.common { border-left: 5px solid var(--common); }
        .item-card.rare { border-left: 5px solid var(--rare); }
        .item-card.unique { border-left: 5px solid var(--unique); background: linear-gradient(90deg, rgba(255,170,0,0.08) 0%, var(--card-bg) 100%); }

        .item-icon { width: 48px; height: 48px; background: #151515; border-radius: 6px; border: 1px solid var(--border-color); padding: 4px; flex-shrink: 0; object-fit: contain; }

        .item-details-box { flex-grow: 1; display: flex; flex-direction: column; gap: 4px; }

        .item-row { display: flex; justify-content: space-between; align-items: center; }
        .item-name { font-weight: bold; font-size: 1rem; }
        .item-name.common { color: var(--common); }
        .item-name.rare { color: #8888ff; }
        .item-name.unique { color: var(--unique); }

        .rarity-tag { font-size: 0.7rem; font-weight: bold; padding: 2px 6px; border-radius: 3px; text-transform: uppercase; }
        .tag-common { background: #333; color: var(--common); }
        .tag-rare { background: #1a1a44; color: #8888ff; }
        .tag-unique { background: #443300; color: var(--unique); }

        .item-info { font-size: 0.8rem; color: var(--text-muted); }
        .item-effect { font-size: 0.85rem; color: #dddddd; }
    </style>
</head>
<body>

<header>
    <h1>Minecraft Dungeons DB</h1>
    <p class="subtitle">Karten-Übersicht & Loot-Datenbank</p>
</header>

<div class="controls">
    <select id="regionSelect" onchange="updateView()">
        <option value="creeper_woods">Creeper-Ebenen (Creeper Woods)</option>
        <option value="soggy_swamp">Sumpf (Soggy Swamp)</option>
        <option value="pumpkin_pastures">Kürbisfelder (Pumpkin Pastures)</option>
        <option value="cacti_canyon">Kakteen-Canyon (Cacti Canyon)</option>
        <option value="redstone_mines">Redstone-Minen (Redstone Mines)</option>
    </select>
    
    <input type="text" id="searchInput" placeholder="Gegenstand suchen..." oninput="updateView()">
</div>

<div class="map-section">
    <div class="map-header">
        <div id="mapTitle" class="map-title">Creeper-Ebenen</div>
        <div id="mapMeta" class="map-meta">Schwierigkeit: Stufe 1+</div>
    </div>
    <div class="map-viewer">
        <img id="mapImg" class="map-image" src="" alt="Kartengrafik">
    </div>
</div>

<div class="section-title">Mögliche Beute (<span id="itemCount">0</span> Items)</div>
<div class="drop-grid" id="dropList"></div>

<script>
const dungeonsDB = {
    creeper_woods: {
        name: "Creeper-Ebenen",
        english: "Creeper Woods",
        level: "Empfohlen: Stufe 1+",
        image: "https://static.wikia.nocookie.net/minecraft_gamepedia/images/a/ab/Creeper_Woods_banner.png",
        drops: [
            { name: "Schwert", type: "Nahkampf", rarity: "common", icon: "https://static.wikia.nocookie.net/minecraft_gamepedia/images/4/44/Iron_Sword_JE2_BE2.png", effect: "Standard-Nahkampfwaffe mit schnellen Hieben." },
            { name: "Axt", type: "Nahkampf", rarity: "common", icon: "https://static.wikia.nocookie.net/minecraft_gamepedia/images/d/d2/Iron_Axe_JE2_BE2.png", effect: "Führt einen Rundumschlag aus." },
            { name: "Jagdbogen", type: "Fernkampf", rarity: "rare", icon: "https://static.wikia.nocookie.net/minecraft_gamepedia/images/2/22/Bow_JE2_BE1.png", effect: "Erhöhter kritischer Trefferschaden." },
            { name: "Jäger-Rüstung", type: "Rüstung", rarity: "rare", icon: "https://static.wikia.nocookie.net/minecraft_gamepedia/images/c/c7/Leather_Tunic_JE4_BE2.png", effect: "+30% Fernkampfschaden, +20% Pfeil-Kapazität." },
            { name: "Sumpf-Klinge", type: "Nahkampf", rarity: "unique", icon: "https://static.wikia.nocookie.net/minecraft_gamepedia/images/6/6a/Golden_Sword_JE3_BE2.png", effect: "Fügt zusätzlich Giftschaden über Zeit zu." }
        ]
    },
    soggy_swamp: {
        name: "Sumpf",
        english: "Soggy Swamp",
        level: "Empfohlen: Stufe 5+",
        image: "https://static.wikia.nocookie.net/minecraft_gamepedia/images/8/8c/Soggy_Swamp_banner.png",
        drops: [
            { name: "Sumpf-Dolche", type: "Nahkampf", rarity: "rare", icon: "https://static.wikia.nocookie.net/minecraft_gamepedia/images/8/85/Iron_Hoe_JE2_BE2.png", effect: "Hohe Angriffsgeschwindigkeit." },
            { name: "Giftschwert", type: "Nahkampf", rarity: "unique", icon: "https://static.wikia.nocookie.net/minecraft_gamepedia/images/6/6a/Golden_Sword_JE3_BE2.png", effect: "Vergiftet Gegner garantiert bei jedem Treffer." },
            { name: "Harfe-Armbrust", type: "Fernkampf", rarity: "unique", icon: "https://static.wikia.nocookie.net/minecraft_gamepedia/images/a/a2/Crossbow_JE2_BE2.png", effect: "Verschießt 5 Bolzen gleichzeitig." }
        ]
    },
    pumpkin_pastures: {
        name: "Kürbisfelder",
        english: "Pumpkin Pastures",
        level: "Empfohlen: Stufe 10+",
        image: "https://static.wikia.nocookie.net/minecraft_gamepedia/images/2/2f/Pumpkin_Pastures_banner.png",
        drops: [
            { name: "Sichel", type: "Nahkampf", rarity: "common", icon: "https://static.wikia.nocookie.net/minecraft_gamepedia/images/8/85/Iron_Hoe_JE2_BE2.png", effect: "Schnelle Angriffe mit hoher Frequenz." },
            { name: "Ritter-Rüstung", type: "Rüstung", rarity: "rare", icon: "https://static.wikia.nocookie.net/minecraft_gamepedia/images/2/2c/Iron_Chestplate_JE2_BE2.png", effect: "-20% erlittener Schaden für das Team." }
        ]
    },
    cacti_canyon: {
        name: "Kakteen-Canyon",
        english: "Cacti Canyon",
        level: "Empfohlen: Stufe 15+",
        image: "https://static.wikia.nocookie.net/minecraft_gamepedia/images/8/86/Cacti_Canyon_banner.png",
        drops: [
            { name: "Wüsten-Säbel", type: "Nahkampf", rarity: "common", icon: "https://static.wikia.nocookie.net/minecraft_gamepedia/images/4/44/Iron_Sword_JE2_BE2.png", effect: "Fügt Blutungsschaden zu." },
            { name: "Meister-Bogen", type: "Fernkampf", rarity: "unique", icon: "https://static.wikia.nocookie.net/minecraft_gamepedia/images/2/22/Bow_JE2_BE1.png", effect: "Hoher Einzelschuss-Schaden." }
        ]
    },
    redstone_mines: {
        name: "Redstone-Minen",
        english: "Redstone Mines",
        level: "Empfohlen: Stufe 20+",
        image: "https://static.wikia.nocookie.net/minecraft_gamepedia/images/9/90/Redstone_Mines_banner.png",
        drops: [
            { name: "Spitzhacke", type: "Nahkampf", rarity: "common", icon: "https://static.wikia.nocookie.net/minecraft_gamepedia/images/d/d4/Iron_Pickaxe_JE3_BE2.png", effect: "Hoher Schaden pro Schlag." },
            { name: "Redstone-Klinge", type: "Nahkampf", rarity: "unique", icon: "https://static.wikia.nocookie.net/minecraft_gamepedia/images/6/6a/Golden_Sword_JE3_BE2.png", effect: "Erzeugt kleine Redstone-Explosionen." }
        ]
    }
};

function updateView() {
    const selectedKey = document.getElementById('regionSelect').value;
    const searchFilter = document.getElementById('searchInput').value.toLowerCase();
    const region = dungeonsDB[selectedKey];

    document.getElementById('mapTitle').innerText = `${region.name} (${region.english})`;
    document.getElementById('mapMeta').innerText = region.level;
    document.getElementById('mapImg').src = region.image;

    const dropContainer = document.getElementById('dropList');
    dropContainer.innerHTML = '';

    const filteredDrops = region.drops.filter(item => 
        item.name.toLowerCase().includes(searchFilter) || 
        item.type.toLowerCase().includes(searchFilter) ||
        item.effect.toLowerCase().includes(searchFilter)
    );

    document.getElementById('itemCount').innerText = filteredDrops.length;

    filteredDrops.forEach(item => {
        const card = document.createElement('div');
        card.className = `item-card ${item.rarity}`;

        let rarityText = item.rarity === 'unique' ? 'Einzigartig' : (item.rarity === 'rare' ? 'Selten' : 'Gewöhnlich');

        card.innerHTML = `
            <img class="item-icon" src="${item.icon}" alt="${item.name}">
            <div class="item-details-box">
                <div class="item-row">
                    <span class="item-name ${item.rarity}">${item.name}</span>
                    <span class="rarity-tag tag-${item.rarity}">${rarityText}</span>
                </div>
                <div class="item-info"><strong>Kategorie:</strong> ${item.type}</div>
                <div class="item-effect">${item.effect}</div>
            </div>
        `;
        dropContainer.appendChild(card);
    });
}

updateView();
</script>

</body>
</html>
