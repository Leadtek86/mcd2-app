<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Schichtplan</title>
    <!-- Google Fonts für die elegante Schreibschrift -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            /* Das gewählte rot-schwarze Wallpaper direkt als nativer Hintergrund */
            background-color: #050507;
            background-image: 
                linear-gradient(to bottom, rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.7)),
                url('data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA='); /* Platzhalter für den flüssigen Base64-Stream, im folgenden Skript voll eingebettet */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            border: 2px solid rgba(255, 255, 255, 0.85);
            border-radius: 24px;
            padding: 16px 10px 20px 10px;
            background: rgba(10, 10, 14, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), inset 0 0 30px rgba(255, 0, 0, 0.05);
            position: relative;
            overflow: hidden;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 0 4px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-title-area {
            text-align: center;
        }

        .year-text {
            color: #ff2200;
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 2px;
            line-height: 1;
            text-shadow: 0 0 14px rgba(255, 34, 0, 0.6);
        }

        .month-script {
            font-family: 'Great Vibes', cursive;
            font-size: 2.1rem;
            color: #ffffff;
            line-height: 1.1;
            margin-top: -2px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        .status-banner {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 5px 8px;
            border-radius: 8px;
            font-size: 0.65rem;
            text-align: center;
            margin-bottom: 10px;
            color: #ccc;
        }
        .status-banner span { color: #ff5555; font-weight: bold; }

        .action-buttons {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }

        .btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 5px;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn.danger { color: #ff7b72; border-color: rgba(255, 123, 114, 0.3); }

        .calendar-card {
            border: 1.5px solid rgba(255, 255, 255, 0.75);
            border-radius: 12px;
            padding: 4px;
            background: rgba(8, 9, 12, 0.5);
            width: 100%;
        }

        .weekdays-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
            font-size: 0.65rem;
            font-weight: 800;
            color: #fff;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 3px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            width: 100%;
        }

        .day-cell {
            background: rgba(15, 18, 24, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            padding: 2px;
            min-height: 60px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.15s ease;
            overflow: hidden;
        }

        .day-cell:active { transform: scale(0.95); }
        .day-cell.other-month { opacity: 0.2; }
        .day-cell.today { border-color: #ff2200 !important; box-shadow: 0 0 8px rgba(255, 34, 0, 0.5); }
        .day-cell.selecting { border: 2px dashed #ff5555 !important; background: rgba(255, 85, 85, 0.15); }

        .day-header-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1px;
        }

        .holiday-indicator {
            font-size: 0.4rem;
            background: #d29922;
            color: #000;
            font-weight: 800;
            padding: 0.5px 2px;
            border-radius: 2px;
            max-width: 32px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .day-number {
            font-size: 0.6rem;
            font-weight: 700;
            color: #ddd;
            margin-left: auto;
        }

        .shift-badge {
            width: 100%;
            border-radius: 4px;
            padding: 2px 1px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 0px;
        }

        .shift-name {
            font-size: 0.48rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .shift-time {
            font-size: 0.38rem;
            opacity: 0.9;
            font-weight: 500;
        }

        /* Schicht-Farben */
        .s-fruh { background: rgba(17, 42, 70, 0.85); color: #58a6ff; border: 1px solid rgba(88, 166, 255, 0.35); }
        .s-nacht { background: rgba(35, 18, 56, 0.85); color: #bc8cff; border: 1px solid rgba(188, 140, 255, 0.35); }
        .s-mittags { background: rgba(56, 31, 13, 0.85); color: #ffa657; border: 1px solid rgba(255, 166, 87, 0.35); }
        .s-frei { background: rgba(13, 46, 28, 0.85); color: #56d364; border: 1px solid rgba(46, 160, 67, 0.45); }
        .s-urlaub { background: rgba(14, 68, 41, 0.9); color: #7ee787; border: 1px solid rgba(63, 185, 80, 0.7); font-weight: 900; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="top-bar">
        <button class="nav-btn" onclick="changeMonth(-1)">❮</button>
        <div class="header-title-area">
            <div class="year-text" id="yearText">2026</div>
            <div class="month-script" id="monthScript">Oktober</div>
        </div>
        <button class="nav-btn" onclick="changeMonth(1)">❯</button>
    </div>

    <div class="status-banner" id="infoBox">
        💡 <span>Urlaub:</span> Tippe Start & Enddatum. Feiertage NRW aktiv!
    </div>

    <div class="action-buttons">
        <button class="btn" onclick="fetchCloudData()">🔄 Live-Sync laden</button>
        <button class="btn danger" onclick="resetVacation()">🗑️ Alles löschen</button>
    </div>

    <div class="calendar-card">
        <div class="weekdays-header">
            <div>MO</div><div>DI</div><div>MI</div><div>DO</div><div>FR</div><div>SA</div><div>SO</div>
        </div>
        <div class="days-grid" id="daysGrid"></div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://lbjpkereemplchdaltpz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxianBrZXJlZW1wbGNoZGFsdHB6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5MDMyNjUsImV4cCI6MjEwNzQ3OTI2NX0.iFPEv3qyhgiLdU55Iday-HssYZdDbYaQolpvglcLcpw";
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentDisplayDate = new Date(2026, 9, 13);
    const shiftCycle = ["fruh", "nacht", "mittags"];
    
    const shiftData = {
        fruh: { name: "Früh", time: "05:55–14:00", class: "s-fruh" },
        nacht: { name: "Nacht", time: "21:55–06:00", class: "s-nacht" },
        mittags: { name: "Mittags", time: "13:55–22:00", class: "s-mittags" },
        frei: { name: "Frei", time: "Frei", class: "s-frei" },
        urlaub: { name: "URLAUB", time: "Frei", class: "s-urlaub" }
    };

    const monthNamesGerman = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];

    function getEasterDate(year) {
        const a = year % 19;
        const b = Math.floor(year / 100);
        const c = year % 100;
        const d = Math.floor(b / 4);
        const e = b % 4;
        const f = Math.floor((b + 8) / 25);
        const g = Math.floor((b - f + 1) / 3);
        const h = (19 * a + b - d - g + 15) % 30;
        const i = Math.floor(c / 4);
        const k = c % 4;
        const l = (32 + 2 * e + 2 * i - h - k) % 7;
        const m = Math.floor((a + 11 * h + 22 * l) / 451);
        const month = Math.floor((h + l - 7 * m + 114) / 31) - 1;
        const day = ((h + l - 7 * m + 114) % 31) + 1;
        return new Date(year, month, day);
    }

    function getHolidaysNRW(year) {
        const holidays = {};
        holidays[`${year}-01-01`] = "Neujahr";
        holidays[`${year}-05-01`] = "Tag d. Arbeit";
        holidays[`${year}-10-03`] = "Tag d. Einheit";
        holidays[`${year}-11-01`] = "Allerheiligen";
        holidays[`${year}-12-25`] = "1. Weihnachten";
        holidays[`${year}-12-26`] = "2. Weihnachten";

        const easter = getEasterDate(year);
        const addDays = (date, days) => {
            const result = new Date(date);
            result.setDate(result.getDate() + days);
            return result.toISOString().split('T')[0];
        };

        holidays[addDays(easter, -2)] = "Karfreitag";
        holidays[addDays(easter, 1)] = "Ostermontag";
        holidays[addDays(easter, 39)] = "Himmelfahrt";
        holidays[addDays(easter, 50)] = "Pfingstmontag";
        holidays[addDays(easter, 60)] = "Fronleichnam";

        return holidays;
    }

    let vacationDays = [];
    let selectionStart = null;

    async function fetchCloudData() {
        setInfo("🔄 Lade Live-Daten...");
        try {
            const { data, error } = await supabaseClient
                .from('vacation_days')
                .select('dates')
                .eq('id', 'shared_plan')
                .maybeSingle();

            if (error) {
                setInfo("⚠️ Ladefehler");
                return;
            }

            vacationDays = (data && data.dates) ? data.dates : [];
            renderCalendar();
            setInfo("✅ Live-Sync aktiv & Feiertage NRW geladen!");
        } catch (e) {
            setInfo("⚠️ Verbindungsfehler");
        }
    }

    async function saveCloudData() {
        try {
            const { error } = await supabaseClient
                .from('vacation_days')
                .upsert({ id: 'shared_plan', dates: vacationDays }, { onConflict: 'id' });

            if (error) {
                setInfo(`⚠️ Speicherfehler: ${error.message}`);
            } else {
                setInfo("✨ In Cloud gespeichert!");
            }
        } catch (e) {
            setInfo("⚠️ Netzwerkfehler beim Speichern!");
        }
    }

    function setInfo(text) {
        document.getElementById("infoBox").innerHTML = text;
    }

    function getCalculatedShift(date) {
        const dayOfWeek = (date.getDay() + 6) % 7;
        if (dayOfWeek >= 5) return "frei";

        const d = new Date(date);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : 1);
        const mondayOfWeek = new Date(d.setDate(diff));
        mondayOfWeek.setHours(0,0,0,0);

        const anchorMonday = new Date(2026, 9, 12);
        anchorMonday.setHours(0,0,0,0);

        const diffTime = mondayOfWeek.getTime() - anchorMonday.getTime();
        const diffWeeks = Math.round(diffTime / (1000 * 3600 * 24 * 7));

        let cycleIndex = diffWeeks % 3;
        if (cycleIndex < 0) cycleIndex += 3;

        return shiftCycle[cycleIndex];
    }

    function getShiftForDate(date) {
        const dateString = date.toISOString().split('T')[0];
        if (vacationDays.includes(dateString)) return "urlaub";
        return getCalculatedShift(date);
    }

    function renderCalendar() {
        const grid = document.getElementById("daysGrid");
        grid.innerHTML = "";

        const year = currentDisplayDate.getFullYear();
        const month = currentDisplayDate.getMonth();

        document.getElementById("yearText").innerText = year;
        document.getElementById("monthScript").innerText = monthNamesGerman[month];

        const holidaysNRW = getHolidaysNRW(year);

        const firstDayOfMonth = new Date(year, month, 1);
        let startDayOffset = (firstDayOfMonth.getDay() + 6) % 7;

        let runner = new Date(year, month, 1 - startDayOffset);
        const today = new Date();
        today.setHours(0,0,0,0);

        for (let i = 0; i < 42; i++) {
            const cellDate = new Date(runner);
            cellDate.setHours(0,0,0,0);

            const isCurrentMonth = runner.getMonth() === month;
            const isToday = cellDate.getTime() === today.getTime();
            const dateStr = runner.toISOString().split('T')[0];
            const holidayName = holidaysNRW[dateStr];

            const shiftKey = getShiftForDate(runner);
            const shift = shiftData[shiftKey];

            const cell = document.createElement("div");
            let isSelecting = selectionStart === dateStr;
            cell.className = `day-cell ${isCurrentMonth ? '' : 'other-month'} ${isToday ? 'today' : ''} ${isSelecting ? 'selecting' : ''}`;
            
            cell.onclick = () => handleDateClick(dateStr);

            let holidayHtml = holidayName ? `<div class="holiday-indicator" title="${holidayName}">${holidayName}</div>` : '';

            cell.innerHTML = `
                <div class="day-header-row">
                    ${holidayHtml}
                    <div class="day-number">${runner.getDate()}</div>
                </div>
                <div class="shift-badge ${shift.class}">
                    <div class="shift-name">${shift.name}</div>
                    <div class="shift-time">${shift.time}</div>
                </div>
            `;

            grid.appendChild(cell);
            runner.setDate(runner.getDate() + 1);
        }
    }

    async function handleDateClick(dateStr) {
        if (vacationDays.includes(dateStr)) {
            vacationDays = vacationDays.filter(d => d !== dateStr);
            selectionStart = null;
            setInfo("⏳ Lösche Urlaub...");
            renderCalendar();
            await saveCloudData();
            renderCalendar();
            return;
        }

        if (!selectionStart) {
            selectionStart = dateStr;
            setInfo(`💡 Start: ${dateStr} – Wähle Enddatum!`);
            renderCalendar();
        } else {
            let start = new Date(selectionStart);
            let end = new Date(dateStr);

            if (start > end) {
                let temp = start;
                start = end;
                end = temp;
            }

            let curr = new Date(start);
            while (curr <= end) {
                const dStr = curr.toISOString().split('T')[0];
                if (!vacationDays.includes(dStr)) {
                    vacationDays.push(dStr);
                }
                curr.setDate(curr.getDate() + 1);
            }

            selectionStart = null;
            setInfo("⏳ Speichere Urlaub...");
            renderCalendar();

            await saveCloudData();
            renderCalendar();
        }
    }

    function changeMonth(delta) {
        currentDisplayDate.setMonth(currentDisplayDate.getMonth() + delta);
        renderCalendar();
    }

    async function resetVacation() {
        if (confirm("Wirklich alle Urlaubstage zurücksetzen?")) {
            vacationDays = [];
            setInfo("⏳ Setze zurück...");
            renderCalendar();
            await saveCloudData();
            renderCalendar();
        }
    }

    fetchCloudData();
</script>

</body>
</html>
