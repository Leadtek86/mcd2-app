<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Dungeons DB</title>
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --border-color: #2c2c2c;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --common: #a0a0a0;
            --rare: #5555ff;
            --unique: #ffaa00;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 15px; }
        header { text-align: center; padding: 15px 0; border-bottom: 2px solid #ffaa00; margin-bottom: 20px; }
        h1 { color: #ffaa00; font-size: 1.6rem; text-transform: uppercase; }
        .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        select, input { width: 100%; padding: 12px; background: var(--card-bg); border: 1px solid var(--border-color); color: #fff; border-radius: 6px; }
        .map-section { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
        .map-header { padding: 15px; background: #252525; border-bottom: 1px solid var(--border-color); }
        .map-title { font-size: 1.2rem; font-weight: bold; color: #ffaa00; }
        .map-viewer { width: 100%; height: 200px; background: #000; }
        .map-image { width: 100%; height: 100%; object-fit: cover; display: block; }
        .drop-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .item-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 12px; display: flex; gap: 12px; align-items: center; }
        .item-card.common { border-left: 5px solid var(--common); }
        .item-card.rare { border-left: 5px solid var(--rare); }
        .item-card.unique { border-left: 5px solid var(--unique); }
        .item-name { font-weight: bold; }
    </style>
</head>
<body>

<header>
    <h1>Minecraft Dungeons DB</h1>
</header>

<div class="controls">
    <select id="regionSelect" onchange="updateView()">
        <option value="creeper_woods">Creeper-Ebenen</option>
        <option value="soggy_swamp">Sumpf</option>
    </select>
    <input type="text" id="searchInput" placeholder="Gegenstand suchen..." oninput="updateView()">
</div>

<div class="map-section">
    <div class="map-header">
        <div id="mapTitle" class="map-title">Creeper-Ebenen</div>
    </div>
    <div class="map-viewer">
        <img id="mapImg" class="map-image" src="" alt="Original Map">
    </div>
</div>

<div class="drop-grid" id="dropList"></div>

<script>
const dungeonsDB = {
    creeper_woods: {
        name: "Creeper-Ebenen",
        image: "https://www.dungeonsdb.com/images/maps/creeper_woods.jpg",
        drops: [
            { name: "Schwert", type: "Nahkampf", rarity: "common", effect: "Schnelle Hiebe." }
        ]
    },
    soggy_swamp: {
        name: "Sumpf",
        image: "https://www.dungeonsdb.com/images/maps/soggy_swamp.jpg",
        drops: [
            { name: "Sumpf-Dolche", type: "Nahkampf", rarity: "rare", effect: "Hohe Geschwindigkeit." }
        ]
    }
};

function updateView() {
    const selectedKey = document.getElementById('regionSelect').value;
    const region = dungeonsDB[selectedKey];
    document.getElementById('mapTitle').innerText = region.name;
    document.getElementById('mapImg').src = region.image;
    
    const dropContainer = document.getElementById('dropList');
    dropContainer.innerHTML = '';
    region.drops.forEach(item => {
        dropContainer.innerHTML += `<div class="item-card ${item.rarity}"><span class="item-name">${item.name}</span></div>`;
    });
}
updateView();
</script>

</body>
</html>
