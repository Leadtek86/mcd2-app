<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schichtplan App</title>
    <!-- Supabase Client Bibliothek -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent-gold: #f0883e;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            
            --fruh-bg: #1f3a5f;
            --fruh-border: #388bfd;
            --nacht-bg: #3c1e5a;
            --nacht-border: #a371f7;
            --spat-bg: #5a3214;
            --spat-border: #f0883e;

            --frei-bg: #12381b;
            --frei-border: #2ea043;
            --frei-text: #56d364;

            --urlaub-bg: #0e4429;
            --urlaub-border: #26a641;
            --urlaub-text: #7ee787;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 10px; max-width: 900px; margin: 0 auto; width: 100%; }

        header { text-align: center; padding: 10px 0; border-bottom: 1px solid var(--border-color); margin-bottom: 12px; }
        h1 { color: var(--accent-gold); font-size: 1.3rem; text-transform: uppercase; letter-spacing: 1px; }
        p.subtitle { color: var(--text-muted); font-size: 0.75rem; margin-top: 2px; }

        .controls-bar { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; width: 100%; }
        .legend { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
        .legend-item { display: flex; align-items: center; gap: 4px; font-size: 0.7rem; background: var(--card-bg); padding: 3px 6px; border-radius: 4px; border: 1px solid var(--border-color); }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot.fruh { background: var(--fruh-border); }
        .dot.nacht { background: var(--nacht-border); }
        .dot.mittags { background: var(--spat-border); }
        .dot.frei { background: var(--frei-border); }
        .dot.urlaub { background: var(--urlaub-border); }

        .info-box { background: var(--card-bg); border: 1px solid var(--accent-gold); padding: 8px; border-radius: 6px; font-size: 0.75rem; text-align: center; color: #fff; width: 100%; }
        .info-box span { color: var(--accent-gold); font-weight: bold; }

        .action-row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .btn-action { background: #21262d; color: #fff; border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; font-weight: bold; }
        .btn-action:hover { background: #30363d; border-color: var(--accent-gold); }

        .month-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; background: var(--card-bg); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border-color); width: 100%; }
        .month-nav button { background: #21262d; color: #fff; border: 1px solid var(--border-color); padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .month-title { font-weight: bold; font-size: 0.95rem; color: #fff; }

        .calendar-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 8px; width: 100%; overflow: hidden; }
        .weekdays-header { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 6px; text-align: center; font-size: 0.75rem; font-weight: bold; color: var(--text-muted); }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; width: 100%; }
        
        .day-cell { background: #0d1117; border: 1px solid var(--border-color); border-radius: 6px; padding: 6px 4px; min-height: 80px; display: flex; flex-direction: column; justify-content: space-between; position: relative; cursor: pointer; transition: border-color 0.2s; overflow: hidden; }
        .day-cell:hover { border-color: var(--accent-gold); }
        .day-cell.other-month { opacity: 0.3; background: #080a0f; }
        .day-cell.past { opacity: 0.45; filter: grayscale(30%); }
        .day-cell.today { border: 2px solid #ff0055 !important; }
        .day-cell.selecting { border: 2px dashed var(--urlaub-border) !important; background: #0e2915; }

        .day-number { font-size: 0.75rem; font-weight: bold; color: #fff; text-align: right; }
        .shift-info { display: flex; flex-direction: column; gap: 2px; width: 100%; }
        .shift-name { font-size: 0.6rem; font-weight: bold; text-transform: uppercase; padding: 2px 2px; border-radius: 3px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .shift-time { font-size: 0.55rem; text-align: center; color: #fff; font-weight: 500; }

        .shift-fruh { background: var(--fruh-bg); color: #79c0ff; border: 1px solid var(--fruh-border); }
        .shift-nacht { background: var(--nacht-bg); color: #d2a8ff; border: 1px solid var(--nacht-border); }
        .shift-mittags { background: var(--spat-bg); color: #ffa657; border: 1px solid var(--spat-border); }
        .shift-frei { background: var(--frei-bg); color: var(--frei-text); border: 1px solid var(--frei-border); }
        .shift-urlaub { background: var(--urlaub-bg); color: var(--urlaub-text); border: 1px solid var(--urlaub-border); font-size: 0.65rem; font-weight: 800; }

        @media (max-width: 600px) {
            .day-cell { min-height: 70px; padding: 4px 2px; }
            .shift-time { font-size: 0.5rem; }
            .shift-name { font-size: 0.55rem; }
        }
    </style>
</head>
<body>

<header>
    <h1>Schichtplan App</h1>
    <p class="subtitle">Live-Sync für 2 Personen</p>
</header>

<div class="controls-bar">
    <div class="legend">
        <div class="legend-item"><span class="dot fruh"></span> Früh</div>
        <div class="legend-item"><span class="dot nacht"></span> Nacht</div>
        <div class="legend-item"><span class="dot mittags"></span> Mittags</div>
        <div class="legend-item"><span class="dot frei"></span> Frei</div>
        <div class="legend-item"><span class="dot urlaub"></span> Urlaub</div>
    </div>
    <div class="info-box" id="infoBox">
        💡 <span>Urlaub:</span> Tippe auf Start- und Enddatum. Einzelner Klick auf Urlaub löscht diesen Tag.
    </div>
    <div class="action-row">
        <button class="btn-action" onclick="fetchCloudData()">🔄 Live-Daten laden</button>
        <button class="btn-action" onclick="resetVacation()" style="color: #ff7b72;">🗑️ Alles zurücksetzen</button>
    </div>
</div>

<div class="month-nav">
    <button onclick="changeMonth(-1)">◀ Zurück</button>
    <div class="month-title" id="monthTitle">Oktober 2026</div>
    <button onclick="changeMonth(1)">Weiter ▶</button>
</div>

<div class="calendar-card">
    <div class="weekdays-header">
        <div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div>
    </div>
    <div class="days-grid" id="daysGrid"></div>
</div>

<script>
    const SUPABASE_URL = "https://lbjpkereemplchdaltpz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxianBrZXJlZW1wbGNoZGFsdHB6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5MDMyNjUsImV4cCI6MjEwNzQ3OTI2NX0.iFPEv3qyhgiLdU55Iday-HssYZdDbYaQolpvglcLcpw";
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentDisplayDate = new Date(2026, 9, 13);

    const shiftCycle = ["fruh", "nacht", "mittags"];
    const shiftData = {
        fruh: { name: "Frühschicht", time: "05:55–14:00", class: "shift-fruh" },
        nacht: { name: "Nachtschicht", time: "21:55–06:00", class: "shift-nacht" },
        mittags: { name: "Mittagschicht", time: "13:55–22:00", class: "shift-mittags" },
        frei: { name: "Frei", time: "Wochenende", class: "shift-frei" },
        urlaub: { name: "🌴 URLAUB", time: "Frei", class: "shift-urlaub" }
    };

    const monthNames = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];

    let vacationDays = [];
    let selectionStart = null;

    async function fetchCloudData() {
        document.getElementById("infoBox").innerHTML = `🔄 <span>Lade Live-Daten...</span>`;
        try {
            const { data, error } = await supabaseClient
                .from('vacation_days')
                .select('dates')
                .eq('id', 'shared_plan')
                .maybeSingle();

            if (error) {
                console.error("Ladefehler:", error);
                document.getElementById("infoBox").innerHTML = `⚠️ <span>Ladefehler aufgetreten</span>`;
                return;
            }

            if (data && data.dates) {
                vacationDays = data.dates;
            } else {
                vacationDays = [];
            }
            renderCalendar();
            document.getElementById("infoBox").innerHTML = `✅ <span>Live-Daten geladen!</span>`;
        } catch (e) {
            console.error("Netzwerkfehler:", e);
            document.getElementById("infoBox").innerHTML = `⚠️ <span>Verbindungsfehler beim Laden</span>`;
        }
    }

    async function saveCloudData() {
        try {
            const { error } = await supabaseClient
                .from('vacation_days')
                .upsert({ id: 'shared_plan', dates: vacationDays }, { onConflict: 'id' });

            if (error) {
                console.error("Supabase Fehler:", error);
                document.getElementById("infoBox").innerHTML = `⚠️ <span>Fehler beim Speichern: ${error.message}</span>`;
            } else {
                document.getElementById("infoBox").innerHTML = `✅ <span>Erfolgreich in Cloud gespeichert!</span>`;
            }
        } catch (e) {
            console.error("Netzwerkfehler:", e);
            document.getElementById("infoBox").innerHTML = `⚠️ <span>Netzwerkfehler beim Speichern!</span>`;
        }
    }

    function getCalculatedShift(date) {
        const dayOfWeek = (date.getDay() + 6) % 7;
        if (dayOfWeek >= 5) return "frei";

        const d = new Date(date);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : 1);
        const mondayOfWeek = new Date(d.setDate(diff));
        mondayOfWeek.setHours(0,0,0,0);

        const anchorMonday = new Date(2026, 9, 12);
        anchorMonday.setHours(0,0,0,0);

        const diffTime = mondayOfWeek.getTime() - anchorMonday.getTime();
        const diffWeeks = Math.round(diffTime / (1000 * 3600 * 24 * 7));

        let cycleIndex = diffWeeks % 3;
        if (cycleIndex < 0) cycleIndex += 3;

        return shiftCycle[cycleIndex];
    }

    function getShiftForDate(date) {
        const dateString = date.toISOString().split('T')[0];
        if (vacationDays.includes(dateString)) {
            return "urlaub";
        }
        return getCalculatedShift(date);
    }

    function renderCalendar() {
        const grid = document.getElementById("daysGrid");
        grid.innerHTML = "";

        const year = currentDisplayDate.getFullYear();
        const month = currentDisplayDate.getMonth();

        document.getElementById("monthTitle").innerText = `${monthNames[month]} ${year}`;

        const firstDayOfMonth = new Date(year, month, 1);
        let startDayOffset = (firstDayOfMonth.getDay() + 6) % 7;

        let runner = new Date(year, month, 1 - startDayOffset);
        const today = new Date();
        today.setHours(0,0,0,0);

        for (let i = 0; i < 42; i++) {
            const cellDate = new Date(runner);
            cellDate.setHours(0,0,0,0);

            const isCurrentMonth = runner.getMonth() === month;
            const isToday = cellDate.getTime() === today.getTime();
            const isPast = cellDate.getTime() < today.getTime();
            const dateStr = runner.toISOString().split('T')[0];

            const shiftKey = getShiftForDate(runner);
            const shift = shiftData[shiftKey];

            const cell = document.createElement("div");
            let isSelecting = selectionStart === dateStr;
            cell.className = `day-cell ${isCurrentMonth ? '' : 'other-month'} ${isPast ? 'past' : ''} ${isToday ? 'today' : ''} ${isSelecting ? 'selecting' : ''}`;
            
            cell.onclick = () => handleDateClick(dateStr);

            cell.innerHTML = `
                <div class="day-number">${runner.getDate()}</div>
                <div class="shift-info">
                    <div class="shift-name ${shift.class}">${shift.name}</div>
                    <div class="shift-time">${shift.time}</div>
                </div>
            `;

            grid.appendChild(cell);
            runner.setDate(runner.getDate() + 1);
        }
    }

    async function handleDateClick(dateStr) {
        if (vacationDays.includes(dateStr)) {
            vacationDays = vacationDays.filter(d => d !== dateStr);
            selectionStart = null;
            document.getElementById("infoBox").innerHTML = `⏳ <span>Lösche Urlaub...</span>`;
            renderCalendar();
            await saveCloudData();
            renderCalendar();
            return;
        }

        if (!selectionStart) {
            selectionStart = dateStr;
            document.getElementById("infoBox").innerHTML = `💡 <span>Start: ${dateStr}</span> – Tippe Enddatum an!`;
            renderCalendar();
        } else {
            let start = new Date(selectionStart);
            let end = new Date(dateStr);

            if (start > end) {
                let temp = start;
                start = end;
                end = temp;
            }

            let curr = new Date(start);
            while (curr <= end) {
                const dStr = curr.toISOString().split('T')[0];
                if (!vacationDays.includes(dStr)) {
                    vacationDays.push(dStr);
                }
                curr.setDate(curr.getDate() + 1);
            }

            selectionStart = null;
            document.getElementById("infoBox").innerHTML = `⏳ <span>Speichere in Cloud...</span>`;
            renderCalendar();

            await saveCloudData();
            renderCalendar();
        }
    }

    function changeMonth(delta) {
        currentDisplayDate.setMonth(currentDisplayDate.getMonth() + delta);
        renderCalendar();
    }

    async function resetVacation() {
        if (confirm("Möchtest du wirklich alle Urlaubstage löschen?")) {
            vacationDays = [];
            document.getElementById("infoBox").innerHTML = `⏳ <span>Lösche alles...</span>`;
            renderCalendar();
            await saveCloudData();
            renderCalendar();
        }
    }

    fetchCloudData();
</script>

</body>
</html>
