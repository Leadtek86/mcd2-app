<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Dungeons DB - Map & Items</title>
    <style>
        :root {
            --bg-dark: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent-gold: #f0883e;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --common: #a0a0a0;
            --rare: #5555ff;
            --unique: #ffaa00;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 12px; scroll-behavior: smooth; }

        header { text-align: center; padding: 10px 0; border-bottom: 1px solid var(--border-color); margin-bottom: 15px; }
        h1 { color: #f0883e; font-size: 1.4rem; text-transform: uppercase; letter-spacing: 1px; }
        p.subtitle { color: var(--text-muted); font-size: 0.8rem; margin-top: 2px; }

        .section-title { font-size: 1rem; color: #f0883e; margin: 15px 0 8px 0; text-transform: uppercase; letter-spacing: 0.5px; display: flex; justify-content: space-between; align-items: center; }

        /* Weltkarte Container mit Pan & Zoom */
        .map-container { width: 100%; height: 340px; background: #000; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; position: relative; }
        .map-wrapper { width: 100%; height: 100%; transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1); transform-origin: center center; position: relative; }
        .map-image { width: 100%; height: 100%; object-fit: contain; display: block; }

        /* Stecknadel (Map Pin) */
        .map-pin {
            position: absolute;
            font-size: 2rem;
            transform: translate(-50%, -100%);
            display: none;
            z-index: 10;
            filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.9));
            animation: bounce 0.8s infinite alternate;
        }

        .map-pin-label {
            position: absolute;
            background: rgba(13, 17, 23, 0.95);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: bold;
            white-space: nowrap;
            transform: translate(-50%, -190%);
            display: none;
            z-index: 11;
        }

        @keyframes bounce {
            from { transform: translate(-50%, -100%); }
            to { transform: translate(-50%, -125%); }
        }

        .reset-map-btn { font-size: 0.75rem; background: #21262d; color: #fff; border: 1px solid var(--border-color); padding: 4px 8px; border-radius: 4px; cursor: pointer; }

        /* Filter Controls */
        .controls { display: flex; flex-direction: column; gap: 8px; margin: 15px 0; }
        select, input { width: 100%; padding: 10px; background: var(--card-bg); border: 1px solid var(--border-color); color: #fff; border-radius: 6px; font-size: 0.9rem; }

        .filter-row { display: flex; gap: 8px; }

        /* Item Grid & Cards */
        .drop-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
        .item-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; display: flex; gap: 10px; align-items: center; cursor: pointer; transition: background 0.2s; }
        .item-card:hover { background: #21262d; }
        .item-card.common { border-left: 4px solid var(--common); }
        .item-card.rare { border-left: 4px solid var(--rare); }
        .item-card.unique { border-left: 4px solid var(--unique); background: linear-gradient(90deg, rgba(255,170,0,0.06) 0%, var(--card-bg) 100%); }

        .item-icon-box { width: 44px; height: 44px; background: #0d1117; border-radius: 6px; border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0; }
        .item-details-box { flex-grow: 1; display: flex; flex-direction: column; gap: 3px; }
        .item-row { display: flex; justify-content: space-between; align-items: center; }
        .item-name { font-weight: bold; font-size: 0.95rem; }
        .item-name.common { color: var(--common); }
        .item-name.rare { color: #8888ff; }
        .item-name.unique { color: var(--unique); }

        .rarity-tag { font-size: 0.65rem; font-weight: bold; padding: 2px 5px; border-radius: 3px; text-transform: uppercase; }
        .tag-common { background: #333; color: var(--common); }
        .tag-rare { background: #1a1a44; color: #8888ff; }
        .tag-unique { background: #443300; color: var(--unique); }

        .item-info { font-size: 0.75rem; color: var(--text-muted); }
        .item-effect { font-size: 0.8rem; color: #ddd; }

        .boss-info-box { background: rgba(0,0,0,0.3); border: 1px solid #30363d; padding: 4px 8px; border-radius: 4px; margin-top: 4px; font-size: 0.75rem; display: flex; justify-content: space-between; align-items: center; }
        .boss-name { color: #ff5555; font-weight: bold; }
        .drop-rate { color: #55ff55; font-weight: bold; }

        .location-badge { font-size: 0.75rem; color: var(--accent-gold); font-weight: bold; display: inline-flex; align-items: center; gap: 4px; margin-top: 2px; }
    </style>
</head>
<body>

<header>
    <h1>Minecraft Dungeons DB</h1>
    <p class="subtitle">Weltkarte, Boss-Drops & Exakte Stecknadeln</p>
</header>

<div class="section-title">
    <span>Interaktive Weltkarte</span>
    <button class="reset-map-btn" onclick="resetMap()">🗺️ Übersicht</button>
</div>

<div class="map-container" id="mapContainer">
    <div class="map-wrapper" id="mapWrapper">
        <img src="map.jpg" alt="Minecraft Dungeons Weltkarte" class="map-image">
        <div class="map-pin" id="mapPin">📍</div>
        <div class="map-pin-label" id="mapPinLabel">Boss Spawnpunkt</div>
    </div>
</div>

<div class="section-title">Loot-Datenbank (<span id="itemCount">0</span> Items)</div>

<div class="controls">
    <input type="text" id="searchInput" placeholder="Item, Boss, Effekt oder Region suchen..." oninput="updateView()">
    <div class="filter-row">
        <select id="regionSelect" onchange="updateView()">
            <option value="all">Alle Regionen</option>
            <option value="brave_haven">Brave Haven</option>
            <option value="honeycomb_fields">Honeycomb Fields</option>
            <option value="howling_woods">Howling Woods</option>
            <option value="frozen_fjords">Frozen Fjords</option>
            <option value="rainy_plains">Rainy Plains</option>
            <option value="creeper_woods">Creeper Woods</option>
            <option value="soggy_swamp">Soggy Swamp</option>
            <option value="pumpkin_pastures">Pumpkin Pastures</option>
            <option value="cacti_canyon">Cacti Canyon</option>
            <option value="redstone_mines">Redstone Mines</option>
            <option value="desert_temple">Desert Temple</option>
            <option value="fiery_forge">Fiery Forge</option>
            <option value="high_block_halls">High Block Halls</option>
            <option value="obsidian_pinnacle">Obsidian Pinnacle</option>
        </select>
        <select id="categorySelect" onchange="updateView()">
            <option value="all">Alle Typen</option>
            <option value="Nahkampf">Nahkampf</option>
            <option value="Fernkampf">Fernkampf</option>
            <option value="Rüstung">Rüstung</option>
            <option value="Artefakt">Artefakt</option>
        </select>
    </div>
</div>

<div class="drop-grid" id="dropList"></div>

<script>
// Exakte Koordinaten der Regionen & Boss-Spawns auf deinem Karten-Bild (X / Y)
const regions = {
    brave_haven: { name: "Brave Haven", x: "10%", y: "38%", scale: 2.5 },
    honeycomb_fields: { name: "Honeycomb Fields", x: "30%", y: "32%", scale: 2.5 },
    howling_woods: { name: "Howling Woods", x: "50%", y: "33%", scale: 2.5 },
    frozen_fjords: { name: "Frozen Fjords / Highlands", x: "80%", y: "28%", scale: 2.5 },
    rainy_plains: { name: "Rainy Plains", x: "62%", y: "68%", scale: 2.5 },
    creeper_woods: { name: "Creeper Woods", x: "28%", y: "42%", scale: 2.5 },
    soggy_swamp: { name: "Soggy Swamp", x: "32%", y: "60%", scale: 2.5 },
    pumpkin_pastures: { name: "Pumpkin Pastures", x: "42%", y: "35%", scale: 2.5 },
    cacti_canyon: { name: "Cacti Canyon", x: "52%", y: "55%", scale: 2.5 },
    redstone_mines: { name: "Redstone Mines", x: "58%", y: "40%", scale: 2.5 },
    desert_temple: { name: "Desert Temple", x: "65%", y: "60%", scale: 2.5 },
    fiery_forge: { name: "Fiery Forge", x: "72%", y: "38%", scale: 2.5 },
    high_block_halls: { name: "High Block Halls", x: "82%", y: "45%", scale: 2.5 },
    obsidian_pinnacle: { name: "Obsidian Pinnacle", x: "88%", y: "30%", scale: 2.5 }
};

// Item-Datenbank inkl. bestem Gegnerspawn & Höchster Drop-Chance
const itemsDB = [
    // Honeycomb Fields
    { name: "Honig-Messer", type: "Nahkampf", rarity: "rare", symbol: "🗡️", region: "honeycomb_fields", effect: "Verlangsamungseffekt bei Treffern.", bestEnemy: "Bienenkönigin / Elite Biene", dropRate: "18%" },
    { name: "Bienen-Rüstung", type: "Rüstung", rarity: "unique", symbol: "🐝", region: "honeycomb_fields", effect: "Beschwört Bienen bei erlittenem Schaden.", bestEnemy: "Mini-Boss: Bienenwabe", dropRate: "12%" },

    // Howling Woods
    { name: "Wolfs-Rüstung", type: "Rüstung", rarity: "rare", symbol: "🐺", region: "howling_woods", effect: "+20% Waffen-Schadens-Aura für Verbündete.", bestEnemy: "Höhlen-Alptraum Wolf", dropRate: "15%" },
    { name: "Sumpf-Klinge", type: "Nahkampf", rarity: "unique", symbol: "🗡️", region: "howling_woods", effect: "Fügt zusätzlich Giftschaden über Zeit zu.", bestEnemy: "Skelett-Monomaniac", dropRate: "10%" },

    // Frozen Fjords
    { name: "Eis-Sensen-Klinge", type: "Nahkampf", rarity: "unique", symbol: "❄️", region: "frozen_fjords", effect: "Verlangsamt nahe Gegner nach Kills.", bestEnemy: "Frost-Evoker Boss", dropRate: "14%" },
    { name: "Eis-Zauberstab", type: "Artefakt", rarity: "rare", symbol: "🔮", region: "frozen_fjords", effect: "Friert Gegner in einem Zielgebiet ein.", bestEnemy: "Eis-Wächter", dropRate: "22%" },

    // Rainy Plains
    { name: "Blitz-Speer", type: "Nahkampf", rarity: "unique", symbol: "⚡", region: "rainy_plains", effect: "Erzeugt Blitzeinschläge bei kritischen Treffern.", bestEnemy: "Gewitter-Gargoyle", dropRate: "11%" },

    // Creeper Woods
    { name: "Schwert", type: "Nahkampf", rarity: "common", symbol: "⚔️", region: "creeper_woods", effect: "Ausgewogene Nahkampfwaffe mit schnellen Hieben.", bestEnemy: "Zombie-Anführer", dropRate: "35%" },
    { name: "Jäger-Rüstung", type: "Rüstung", rarity: "rare", symbol: "🛡️", region: "creeper_woods", effect: "+30% Fernkampfschaden, +20% Pfeil-Kapazität.", bestEnemy: "Skelett-Schütze Elite", dropRate: "20%" },
    { name: "Feuerwerk-Pfeil", type: "Artefakt", rarity: "common", symbol: "🎆", region: "creeper_woods", effect: "Verwandelt den nächsten Pfeil in eine Explosion.", bestEnemy: "Creeper-König (Ende)", dropRate: "28%" },

    // Soggy Swamp
    { name: "Giftschwert", type: "Nahkampf", rarity: "unique", symbol: "🧪", region: "soggy_swamp", effect: "Vergiftet Gegner garantiert bei jedem Treffer.", bestEnemy: "Sumpf-Hexenmeister / Hexen", dropRate: "12%" },
    { name: "Harfe-Armbrust", type: "Fernkampf", rarity: "unique", symbol: "🏹", region: "soggy_swamp", effect: "Verschießt 5 Bolzen gleichzeitig im Fächer.", bestEnemy: "Sumpf-Klotz (Hauptboss)", dropRate: "15%" },

    // Pumpkin Pastures
    { name: "Sensen-Klinge", type: "Nahkampf", rarity: "unique", symbol: "✨", region: "pumpkin_pastures", effect: "Stiehlt Leben von besiegten Gegnern.", bestEnemy: "Evoker (Beschwörer Boss)", dropRate: "14%" },
    { name: "Ritter-Rüstung", type: "Rüstung", rarity: "rare", symbol: "🛡️", region: "pumpkin_pastures", effect: "-20% erlittener Schaden für das Team.", bestEnemy: "Kürbis-Ritter Mini-Boss", dropRate: "25%" },

    // Cacti Canyon
    { name: "Meister-Bogen", type: "Fernkampf", rarity: "unique", symbol: "🏹", region: "cacti_canyon", effect: "Enorm hoher Schaden und erhöhte Pfeilgeschwindigkeit.", bestEnemy: "Kaktus-Wächter Boss", dropRate: "13%" },

    // Redstone Mines
    { name: "Redstone-Klinge", type: "Nahkampf", rarity: "unique", symbol: "💎", region: "redstone_mines", effect: "Erzeugt kleine Redstone-Explosionen bei Treffern.", bestEnemy: "Redstone-Monstrosität", dropRate: "10%" },
    { name: "Redstone-Golem-Amulett", type: "Artefakt", rarity: "unique", symbol: "🗿", region: "redstone_mines", effect: "Beschwört einen Redstone-Golem im Kampf.", bestEnemy: "Redstone-Golem Boss", dropRate: "16%" },

    // Obsidian Pinnacle
    { name: "Meister-Katana", type: "Nahkampf", rarity: "unique", symbol: "⚔️", region: "obsidian_pinnacle", effect: "Hohe Chance auf kritische Treffer mit Max-Schaden.", bestEnemy: "Erz-Illager / Herz des Ender", dropRate: "8%" }
];

function focusRegion(regionKey, enemyName) {
    const wrapper = document.getElementById('mapWrapper');
    const pin = document.getElementById('mapPin');
    const label = document.getElementById('mapPinLabel');
    const region = regions[regionKey];
    
    if (region) {
        // Stecknadel & Text-Banner exakt setzen
        pin.style.left = region.x;
        pin.style.top = region.y;
        pin.style.display = 'block';

        label.style.left = region.x;
        label.style.top = region.y;
        label.innerText = enemyName || "Boss / Gegnerspawn";
        label.style.display = 'block';

        // Zoom & Pan auf den Gegnerspawn
        wrapper.style.transform = `scale(${region.scale}) translate(calc(50% - ${region.x}), calc(50% - ${region.y}))`;
    } else {
        resetMap();
    }

    // Nach oben zur Karte scrollen
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetMap() {
    const wrapper = document.getElementById('mapWrapper');
    const pin = document.getElementById('mapPin');
    const label = document.getElementById('mapPinLabel');
    pin.style.display = 'none';
    label.style.display = 'none';
    wrapper.style.transform = 'scale(1) translate(0px, 0px)';
}

function selectItem(regionKey, enemyName) {
    document.getElementById('regionSelect').value = regionKey;
    focusRegion(regionKey, enemyName);
}

function updateView() {
    const selectedRegion = document.getElementById('regionSelect').value;
    const selectedCategory = document.getElementById('categorySelect').value;
    const searchFilter = document.getElementById('searchInput').value.toLowerCase();
    
    const dropContainer = document.getElementById('dropList');
    dropContainer.innerHTML = '';

    const filtered = itemsDB.filter(item => {
        const regionData = regions[item.region] || {};
        const regionName = regionData.name ? regionData.name.toLowerCase() : "";
        
        const matchesRegion = (selectedRegion === 'all' || item.region === selectedRegion);
        const matchesCategory = (selectedCategory === 'all' || item.type === selectedCategory);
        const matchesSearch = item.name.toLowerCase().includes(searchFilter) || 
                              item.effect.toLowerCase().includes(searchFilter) ||
                              item.bestEnemy.toLowerCase().includes(searchFilter) ||
                              regionName.includes(searchFilter);

        return matchesRegion && matchesCategory && matchesSearch;
    });

    document.getElementById('itemCount').innerText = filtered.length;

    filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = `item-card ${item.rarity}`;
        let rarityText = item.rarity === 'unique' ? 'Einzigartig' : (item.rarity === 'rare' ? 'Selten' : 'Gewöhnlich');
        const regionInfo = regions[item.region] ? regions[item.region].name : item.region;

        card.onclick = () => selectItem(item.region, item.bestEnemy);

        card.innerHTML = `
            <div class="item-icon-box">${item.symbol}</div>
            <div class="item-details-box">
                <div class="item-row">
                    <span class="item-name ${item.rarity}">${item.name}</span>
                    <span class="rarity-tag tag-${item.rarity}">${rarityText}</span>
                </div>
                <div class="item-info"><strong>Typ:</strong> ${item.type} | <strong>Region:</strong> ${regionInfo}</div>
                <div class="item-effect">${item.effect}</div>
                <div class="boss-info-box">
                    <span>👾 Bestes Ziel: <span class="boss-name">${item.bestEnemy}</span></span>
                    <span class="drop-rate">🎯 ${item.dropRate}</span>
                </div>
                <div class="location-badge">📍 Tippen für Stecknadel auf Gegner</div>
            </div>
        `;
        dropContainer.appendChild(card);
    });
}

// Initialer Aufruf
updateView();
</script>

</body>
</html>
