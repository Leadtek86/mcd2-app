<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Dungeons DB - Alle Items Komplett</title>
    <style>
        :root {
            --bg-dark: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent-gold: #f0883e;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --common: #a0a0a0;
            --rare: #5555ff;
            --unique: #ffaa00;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 10px; scroll-behavior: smooth; }

        header { text-align: center; padding: 8px 0; border-bottom: 1px solid var(--border-color); margin-bottom: 10px; }
        h1 { color: #f0883e; font-size: 1.3rem; text-transform: uppercase; letter-spacing: 1px; }
        p.subtitle { color: var(--text-muted); font-size: 0.75rem; margin-top: 2px; }

        .section-title { font-size: 0.95rem; color: #f0883e; margin: 12px 0 6px 0; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }

        /* Weltkarte Container */
        .map-container { width: 100%; height: 320px; background: #000; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; position: relative; }
        
        .map-wrapper { 
            width: 100%; 
            height: 100%; 
            transition: transform 0.5s ease-in-out; 
            transform-origin: center center; 
            position: relative; 
        }
        
        .map-image { width: 100%; height: 100%; object-fit: contain; display: block; }

        /* Exakte Stecknadel */
        .map-pin-box {
            position: absolute;
            transform: translate(-50%, -100%);
            display: none;
            z-index: 30;
            pointer-events: none;
            text-align: center;
        }

        .map-pin {
            font-size: 2.2rem;
            line-height: 1;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.95));
            animation: bounce 0.6s infinite alternate;
        }

        .map-pin-label {
            background: rgba(13, 17, 23, 0.95);
            color: #ffaa00;
            border: 1px solid #f0883e;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: bold;
            white-space: nowrap;
            margin-top: -2px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.9);
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }

        .reset-map-btn { font-size: 0.7rem; background: #21262d; color: #fff; border: 1px solid var(--border-color); padding: 4px 8px; border-radius: 4px; cursor: pointer; }

        /* Filter Controls */
        .controls { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; }
        select, input { width: 100%; padding: 9px; background: var(--card-bg); border: 1px solid var(--border-color); color: #fff; border-radius: 6px; font-size: 0.85rem; }

        .filter-row { display: flex; gap: 6px; }

        /* Item Cards */
        .drop-grid { display: grid; grid-template-columns: 1fr; gap: 6px; max-height: 48vh; overflow-y: auto; padding-right: 2px; }
        .item-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 8px 10px; display: flex; gap: 10px; align-items: center; cursor: pointer; transition: background 0.2s; }
        .item-card:hover { background: #21262d; }
        .item-card.common { border-left: 4px solid var(--common); }
        .item-card.rare { border-left: 4px solid var(--rare); }
        .item-card.unique { border-left: 4px solid var(--unique); background: linear-gradient(90deg, rgba(255,170,0,0.06) 0%, var(--card-bg) 100%); }

        .item-icon-box { width: 38px; height: 38px; background: #0d1117; border-radius: 6px; border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
        .item-details-box { flex-grow: 1; display: flex; flex-direction: column; gap: 2px; }
        .item-row { display: flex; justify-content: space-between; align-items: center; }
        .item-name { font-weight: bold; font-size: 0.9rem; }
        .item-name.common { color: var(--common); }
        .item-name.rare { color: #8888ff; }
        .item-name.unique { color: var(--unique); }

        .rarity-tag { font-size: 0.6rem; font-weight: bold; padding: 1px 4px; border-radius: 3px; text-transform: uppercase; }
        .tag-common { background: #333; color: var(--common); }
        .tag-rare { background: #1a1a44; color: #8888ff; }
        .tag-unique { background: #443300; color: var(--unique); }

        .item-info { font-size: 0.7rem; color: var(--text-muted); }
        .item-effect { font-size: 0.75rem; color: #ddd; }

        .boss-info-box { background: rgba(0,0,0,0.4); border: 1px solid #30363d; padding: 3px 6px; border-radius: 4px; margin-top: 3px; font-size: 0.7rem; display: flex; justify-content: space-between; align-items: center; }
        .boss-name { color: #ff5555; font-weight: bold; }
        .drop-rate { color: #55ff55; font-weight: bold; }

        .location-badge { font-size: 0.65rem; color: var(--accent-gold); font-weight: bold; margin-top: 1px; }
    </style>
</head>

function focusTarget(xVal, yVal, enemyName) {
    const wrapper = document.getElementById('mapWrapper');
    const pinBox = document.getElementById('mapPinBox');
    const label = document.getElementById('mapPinLabel');
    
    pinBox.style.left = xVal + '%';
    pinBox.style.top = yVal + '%';
    pinBox.style.display = 'block';
    label.innerText = enemyName || "Gegner Spawn";

    wrapper.style.transform = `scale(3.4) translate(calc(50% - ${xVal}%), calc(50% - ${yVal}%))`;
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetMap() {
    const wrapper = document.getElementById('mapWrapper');
    const pinBox = document.getElementById('mapPinBox');
    pinBox.style.display = 'none';
    wrapper.style.transform = 'scale(1) translate(0px, 0px)';
}

function updateView() {
    const selectedRegion = document.getElementById('regionSelect').value;
    const selectedCategory = document.getElementById('categorySelect').value;
    const searchFilter = document.getElementById('searchInput').value.toLowerCase();
    
    const dropContainer = document.getElementById('dropList');
    dropContainer.innerHTML = '';

    const filtered = itemsDB.filter(item => {
        const matchesRegion = (selectedRegion === 'all' || item.region === selectedRegion);
        const matchesCategory = (selectedCategory === 'all' || item.type === selectedCategory);
        const matchesSearch = item.name.toLowerCase().includes(searchFilter) || 
                              item.effect.toLowerCase().includes(searchFilter) ||
                              item.bestEnemy.toLowerCase().includes(searchFilter) ||
                              item.region.toLowerCase().includes(searchFilter);

        return matchesRegion && matchesCategory && matchesSearch;
    });

    document.getElementById('itemCount').innerText = filtered.length;

    filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = `item-card ${item.rarity}`;
        let rarityText = item.rarity === 'unique' ? 'Einzigartig' : (item.rarity === 'rare' ? 'Selten' : 'Gewöhnlich');
        const regionName = regions[item.region] ? regions[item.region].name : item.region;

        card.onclick = () => focusTarget(item.x, item.y, item.bestEnemy);

        card.innerHTML = `
            <div class="item-icon-box">${item.symbol}</div>
            <div class="item-details-box">
                <div class="item-row">
                    <span class="item-name ${item.rarity}">${item.name}</span>
                    <span class="rarity-tag tag-${item.rarity}">${rarityText}</span>
                </div>
                <div class="item-info"><strong>Typ:</strong> ${item.type} | <strong>Region:</strong> ${regionName}</div>
                <div class="item-effect">${item.effect}</div>
                <div class="boss-info-box">
                    <span>👾 Gegner: <span class="boss-name">${item.bestEnemy}</span></span>
                    <span class="drop-rate">🎯 ${item.dropRate}</span>
                </div>
                <div class="location-badge">📍 Exakte Nadel anzeigen</div>
            </div>
        `;
        dropContainer.appendChild(card);
    });
}

updateView();
</script>
