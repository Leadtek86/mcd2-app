    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: #050507;
            background-image: 
                linear-gradient(to bottom, rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.7)),
                url('Hintergrund.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            border: 2px solid rgba(255, 255, 255, 0.85);
            border-radius: 24px;
            padding: 16px 10px 20px 10px;
            background: rgba(10, 10, 14, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), inset 0 0 30px rgba(255, 0, 0, 0.05);
            position: relative;
            overflow: hidden;
        }

        /* PC-Optimierung: Wenn der Bildschirm breiter als 768px ist, wird die App größer & angenehmer lesbar */
        @media (min-width: 768px) {
            .app-container {
                max-width: 700px;
                padding: 24px 20px 28px 20px;
                border-radius: 32px;
            }
            .year-text { font-size: 2rem !important; }
            .month-script { font-size: 3rem !important; }
            .day-cell { min-height: 95px !important; padding: 4px !important; border-radius: 10px !important; }
            .day-number { font-size: 0.85rem !important; }
            .shift-name { font-size: 0.75rem !important; }
            .shift-time { font-size: 0.6rem !important; display: block !important; }
            .weekdays-header { font-size: 0.85rem !important; }
            .status-banner { font-size: 0.8rem !important; padding: 8px !important; }
            .btn { font-size: 0.8rem !important; padding: 8px !important; }
            .holiday-indicator { font-size: 0.55rem !important; max-width: 55px !important; padding: 1px 4px !important; }
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 0 4px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-title-area {
            text-align: center;
        }

        .year-text {
            color: #ff2200;
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 2px;
            line-height: 1;
            text-shadow: 0 0 14px rgba(255, 34, 0, 0.6);
        }

        .month-script {
            font-family: 'Great Vibes', cursive;
            font-size: 2.1rem;
            color: #ffffff;
            line-height: 1.1;
            margin-top: -2px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        .status-banner {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 5px 8px;
            border-radius: 8px;
            font-size: 0.65rem;
            text-align: center;
            margin-bottom: 10px;
            color: #ccc;
        }
        .status-banner span { color: #ff5555; font-weight: bold; }

        .action-buttons {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }

        .btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 5px;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn.danger { color: #ff7b72; border-color: rgba(255, 123, 114, 0.3); }

        .calendar-card {
            border: 1.5px solid rgba(255, 255, 255, 0.75);
            border-radius: 12px;
            padding: 4px;
            background: rgba(8, 9, 12, 0.5);
            width: 100%;
        }

        .weekdays-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
            font-size: 0.65rem;
            font-weight: 800;
            color: #fff;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 3px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            width: 100%;
        }

        .day-cell {
            background: rgba(15, 18, 24, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            padding: 2px;
            min-height: 60px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.15s ease;
            overflow: hidden;
        }

        .day-cell:active { transform: scale(0.95); }
        .day-cell.other-month { opacity: 0.2; }
        .day-cell.today { border-color: #ff2200 !important; box-shadow: 0 0 8px rgba(255, 34, 0, 0.5); }
        .day-cell.selecting { border: 2px dashed #ff5555 !important; background: rgba(255, 85, 85, 0.15); }

        .day-header-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1px;
        }

        .holiday-indicator {
            font-size: 0.4rem;
            background: #d29922;
            color: #000;
            font-weight: 800;
            padding: 0.5px 2px;
            border-radius: 2px;
            max-width: 32px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .day-number {
            font-size: 0.6rem;
            font-weight: 700;
            color: #ddd;
            margin-left: auto;
        }

        .shift-badge {
            width: 100%;
            border-radius: 4px;
            padding: 2px 1px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 0px;
        }

        .shift-name {
            font-size: 0.48rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .shift-time {
            font-size: 0.38rem;
            opacity: 0.9;
            font-weight: 500;
        }

        /* Schicht-Farben */
        .s-fruh { background: rgba(17, 42, 70, 0.85); color: #58a6ff; border: 1px solid rgba(88, 166, 255, 0.35); }
        .s-nacht { background: rgba(35, 18, 56, 0.85); color: #bc8cff; border: 1px solid rgba(188, 140, 255, 0.35); }
        .s-mittags { background: rgba(56, 31, 13, 0.85); color: #ffa657; border: 1px solid rgba(255, 166, 87, 0.35); }
        .s-frei { background: rgba(13, 46, 28, 0.85); color: #56d364; border: 1px solid rgba(46, 160, 67, 0.45); }
        .s-urlaub { background: rgba(14, 68, 41, 0.9); color: #7ee787; border: 1px solid rgba(63, 185, 80, 0.7); font-weight: 900; }
    </style>
